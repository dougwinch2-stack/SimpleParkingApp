<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <title>Doug's Simple Parking App</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #17212b;
      background: #eef3f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    header {
      background: #0b4f6c;
      color: white;
      padding: 18px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 1.45rem;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    label {
      font-weight: 700;
      font-size: 0.9rem;
    }

    select,
    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #aebbc4;
      border-radius: 8px;
      background: white;
      padding: 10px 12px;
      font-size: 1rem;
    }

    .summary {
      margin: 6px 0 12px;
      font-size: 0.9rem;
      color: #4d5b66;
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(20, 40, 55, 0.10);
      border-left: 5px solid #0b4f6c;
    }

    .hospital {
      color: #0b4f6c;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .ward {
      margin: 4px 0 8px;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .details {
      display: grid;
      gap: 4px;
      margin-bottom: 12px;
      color: #33434e;
      font-size: 0.95rem;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 14px;
      text-align: center;
      flex: 1 1 145px;
    }

    .parking-map-button {
      color: #0b4f6c;
      background: #e4f1f6;
      border: 1px solid #8db5c6;
    }

    .hospital-map-button {
      color: #5a3a00;
      background: #fff3cd;
      border: 1px solid #d5b45b;
    }

    .no-hospital-map-button {
      color: #66737c;
      background: #edf1f3;
      border: 1px solid #c4cdd3;
      cursor: default;
    }

    .navigate-button {
      color: white;
      background: #0b6e4f;
      border: 1px solid #0b6e4f;
    }

    .unavailable {
      padding: 4px 0 10px;
      color: #8a3c1f;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .empty {
      background: white;
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      color: #53616b;
    }
  </style>
</head>
<body>
  <header>
    <h1>Doug's Simple Parking App</h1>
    <p>Find a ward, view the recommended entrance and start navigation.</p>
  </header>

  <main>
    <section class="controls" aria-label="Ward filters">
      <div>
        <label for="hospitalFilter">Hospital</label>
        <select id="hospitalFilter">
          <option value="">All hospitals</option>
        </select>
      </div>

      <div>
        <label for="searchInput">Ward or Department</label>
        <input
          id="searchInput"
          type="search"
          placeholder="Search ward, department or clinic..."
          autocomplete="off"
        >
      </div>
    </section>

    <div id="summary" class="summary"></div>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <script>
    const DATA_FILES = {
      wards: ["dataWards.csv", "data-wards.csv"],
      parking: ["dataParkingLocations.csv", "data-parkingLocations.csv"],
      diagrams: ["dataHospitalDiagrams.csv", "data-hospitalDiagrams.csv"]
    };

    const hospitalFilter = document.getElementById("hospitalFilter");
    const searchInput = document.getElementById("searchInput");
    const resultsElement = document.getElementById("results");
    const summaryElement = document.getElementById("summary");

    let wardsData = [];
    let parkingLookup = new Map();
    let diagramsLookup = new Map();

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatNotes(value) {
      return escapeHtml(value).replace(/\|/g, "<br>");
    }

    function normalise(value) {
      return String(value == null ? "" : value).trim();
    }

    function lookupKey(hospital, parkingLocation) {
      return `${normalise(hospital)}\u0000${normalise(parkingLocation)}`;
    }

    /*
      Small CSV parser supporting:
      - quoted fields
      - commas inside quoted fields
      - doubled quotation marks
      - Windows and Unix line endings
    */
    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      text = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i += 1) {
        const character = text[i];

        if (inQuotes) {
          if (character === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i += 1;
            } else {
              inQuotes = false;
            }
          } else {
            field += character;
          }
          continue;
        }

        if (character === '"') {
          inQuotes = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (character !== "\r") {
          field += character;
        }
      }

      if (field !== "" || row.length > 0) {
        row.push(field);
        rows.push(row);
      }

      while (
        rows.length > 0 &&
        rows[rows.length - 1].every(value => value.trim() === "")
      ) {
        rows.pop();
      }

      if (rows.length === 0) return [];

      const headers = rows[0].map(header => header.trim());

      return rows.slice(1)
        .filter(values => values.some(value => value.trim() !== ""))
        .map(values => {
          const record = {};
          headers.forEach((header, index) => {
            record[header] = values[index] == null ? "" : values[index].trim();
          });
          return record;
        });
    }

    async function fetchFirstAvailable(filenames) {
      let lastError = null;

      for (const filename of filenames) {
        try {
          const response = await fetch(filename, { cache: "no-store" });

          if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
          }

          return {
            filename,
            records: parseCsv(await response.text())
          };
        } catch (error) {
          lastError = error;
        }
      }

      throw new Error(
        `Could not load ${filenames.join(" or ")}${lastError ? `: ${lastError.message}` : ""}`
      );
    }

    function requireHeaders(records, requiredHeaders, filename) {
      if (records.length === 0) {
        throw new Error(`${filename} contains no data rows.`);
      }

      const availableHeaders = Object.keys(records[0]);
      const missing = requiredHeaders.filter(
        header => !availableHeaders.includes(header)
      );

      if (missing.length > 0) {
        throw new Error(
          `${filename} is missing ${missing.join(", ")}.`
        );
      }
    }

    function parseCoordinates(value) {
      const parts = normalise(value).split(",").map(part => part.trim());

      if (parts.length !== 2) return null;

      const latitude = Number(parts[0]);
      const longitude = Number(parts[1]);

      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        return null;
      }

      return { latitude, longitude };
    }

    function mapUrl(coordinates) {
      if (!coordinates) return "";

      const query = `${coordinates.latitude},${coordinates.longitude}`;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function navigationUrl(coordinates) {
      if (!coordinates) return "";

      const destination = `${coordinates.latitude},${coordinates.longitude}`;
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&travelmode=driving`;
    }

    function hospitalDiagramButtons(hospital) {
      const diagrams = diagramsLookup.get(hospital) || [];

      if (diagrams.length === 0) {
        return '<span class="button no-hospital-map-button" aria-disabled="true">No Hospital Diagram</span>';
      }

      return diagrams.map(diagram => `
        <a
          class="button hospital-map-button"
          href="${escapeHtml(diagram.file)}"
          target="_blank"
          rel="noopener"
        >${escapeHtml(diagram.name)}</a>
      `).join("");
    }

    function populateHospitals() {
      hospitalFilter.innerHTML = '<option value="">All hospitals</option>';

      const hospitals = [...new Set(
        wardsData.map(item => item.hospital).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));

      hospitals.forEach(hospital => {
        const option = document.createElement("option");
        option.value = hospital;
        option.textContent = hospital;
        hospitalFilter.appendChild(option);
      });
    }

    function renderResults() {
      const selectedHospital = hospitalFilter.value;
      const search = searchInput.value.trim().toLowerCase();

      const matches = wardsData
        .filter(item => !selectedHospital || item.hospital === selectedHospital)
        .filter(item => {
          if (!search) return true;

          const searchable = [
            item.ward,
            item.floor,
            item.notes
          ].join(" ").toLowerCase();

          return searchable.includes(search);
        })
        .sort((a, b) =>
          a.hospital.localeCompare(b.hospital) ||
          a.ward.localeCompare(b.ward)
        );

      summaryElement.textContent =
        `${matches.length} ${matches.length === 1 ? "result" : "results"}`;

      if (matches.length === 0) {
        resultsElement.innerHTML =
          '<div class="empty">No wards match your search.</div>';
        return;
      }

      resultsElement.innerHTML = matches.map(item => {
        const parkingLocationName = item.parkingLocation;
        const location = parkingLookup.get(
          lookupKey(item.hospital, parkingLocationName)
        );

        const floor = item.floor
          ? `<div><strong>Floor:</strong> ${escapeHtml(item.floor)}</div>`
          : "";

        const notes = item.notes
          ? `<div><strong>Notes:</strong> ${formatNotes(item.notes)}</div>`
          : "";

        const diagramButtons = hospitalDiagramButtons(item.hospital);

        if (
          !location ||
          parkingLocationName.toUpperCase() === "TBC" ||
          !location.coordinates
        ) {
          return `
            <article class="card">
              <div class="hospital">${escapeHtml(item.hospital)}</div>
              <div class="ward">${escapeHtml(item.ward)}</div>
              <div class="details">
                ${floor}
                ${parkingLocationName && parkingLocationName.toUpperCase() !== "TBC"
                  ? `<div><strong>Park at:</strong> ${escapeHtml(parkingLocationName)}</div>`
                  : ""}
                ${notes}
              </div>
              <div class="unavailable">Parking location not yet available</div>
              <div class="buttons">${diagramButtons}</div>
            </article>
          `;
        }

        const parkingButton = `
          <a
            class="button parking-map-button"
            href="${escapeHtml(mapUrl(location.coordinates))}"
            target="_blank"
            rel="noopener"
          >Map</a>
        `;

        const navigationButton = `
          <a
            class="button navigate-button"
            href="${escapeHtml(navigationUrl(location.coordinates))}"
            target="_blank"
            rel="noopener"
          >Navigate</a>
        `;

        return `
          <article class="card">
            <div class="hospital">${escapeHtml(item.hospital)}</div>
            <div class="ward">${escapeHtml(item.ward)}</div>
            <div class="details">
              ${floor}
              <div><strong>Park at:</strong> ${escapeHtml(parkingLocationName)}</div>
              ${location.driverNotes
                ? `<div><strong>Driver notes:</strong> ${formatNotes(location.driverNotes)}</div>`
                : ""}
              ${notes}
            </div>
            <div class="buttons">
              ${parkingButton}
              ${navigationButton}
              ${diagramButtons}
            </div>
          </article>
        `;
      }).join("");
    }

    function buildLookups(parkingRecords, diagramRecords) {
      parkingLookup = new Map();
      diagramsLookup = new Map();

      parkingRecords.forEach(record => {
        const hospital = normalise(record.Hospital);
        const parkingLocation = normalise(record.ParkingLocation);

        if (!hospital || !parkingLocation) return;

        parkingLookup.set(lookupKey(hospital, parkingLocation), {
          coordinates: parseCoordinates(record.Coordinates),
          driverNotes: normalise(record.DriverNotes)
        });
      });

      diagramRecords.forEach(record => {
        const hospital = normalise(record.Hospital);
        const name = normalise(record.DiagramName);
        const file = normalise(record.File);

        if (!hospital || !name || !file) return;

        if (!diagramsLookup.has(hospital)) {
          diagramsLookup.set(hospital, []);
        }

        diagramsLookup.get(hospital).push({ name, file });
      });
    }

    async function startApp() {
      summaryElement.textContent = "Loading data...";
      resultsElement.innerHTML =
        '<div class="empty">Loading ward and parking information...</div>';

      try {
        const [wardsResult, parkingResult, diagramsResult] = await Promise.all([
          fetchFirstAvailable(DATA_FILES.wards),
          fetchFirstAvailable(DATA_FILES.parking),
          fetchFirstAvailable(DATA_FILES.diagrams)
        ]);

        requireHeaders(
          wardsResult.records,
          ["Hospital", "Ward", "Floor", "ParkingLocation", "Notes"],
          wardsResult.filename
        );

        requireHeaders(
          parkingResult.records,
          ["Hospital", "ParkingLocation", "Coordinates", "DriverNotes"],
          parkingResult.filename
        );

        requireHeaders(
          diagramsResult.records,
          ["Hospital", "DiagramName", "File"],
          diagramsResult.filename
        );

        wardsData = wardsResult.records.map(record => ({
          hospital: normalise(record.Hospital),
          ward: normalise(record.Ward),
          floor: normalise(record.Floor),
          parkingLocation: normalise(record.ParkingLocation),
          notes: normalise(record.Notes)
        })).filter(item => item.hospital && item.ward);

        buildLookups(parkingResult.records, diagramsResult.records);
        populateHospitals();

        hospitalFilter.addEventListener("change", renderResults);
        searchInput.addEventListener("input", renderResults);

        renderResults();
      } catch (error) {
        console.error(error);
        summaryElement.textContent = "Data failed to load";
        resultsElement.innerHTML = `
          <div class="empty">
            <strong>The CSV data files could not be loaded.</strong><br><br>
            ${escapeHtml(error.message)}<br><br>
            Check that index2.html and all three CSV files are in the same
            GitHub folder, and that their filenames use exactly the same
            capital letters.
          </div>
        `;
      }
    }

    startApp();
  </script>
</body>
</html>
