<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <meta name="robots" content="noindex">
  <title>Admin · Doug's Parking App</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="icon" href="icon-shortcut-512.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Doug's Parking App">
  <link rel="stylesheet" href="dougs.css">
  <script src="dougs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    /* Page-only layout; colours come from dougs.css tokens */
    .admin-list { display: grid; gap: var(--space-2); }
    .admin-row {
      display: flex; justify-content: space-between; align-items: center; gap: var(--space-3);
      width: 100%; min-height: var(--touch); padding: var(--space-3) var(--space-4);
      background: var(--surface); color: var(--text); text-align: left;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font: inherit; cursor: pointer;
    }
    .admin-row:hover { border-color: var(--border-strong); }
    .admin-row__main { min-width: 0; }
    .admin-row__title { font-weight: 700; }
    .admin-row__sub { color: var(--text-muted); font-size: var(--text-sm); }
    .admin-row__chev { color: var(--text-muted); flex: none; }
    [hidden] { display: none !important; }
    .suggestion-text { white-space: pre-wrap; margin: var(--space-2) 0 var(--space-1); }
    .sugg-meta { color: var(--text-muted); font-size: var(--text-sm); font-weight: 600; }
    .sugg-title { font-size: var(--text-md); font-weight: 700; margin: var(--space-1) 0 0; }
    .sugg-links { display: flex; flex-wrap: wrap; gap: 0 var(--space-4); }
    .link-btn {
      display: inline-flex; align-items: center;
      background: none; border: 0; padding: 0; min-height: 40px;
      color: var(--brand-text); font: inherit; font-size: var(--text-sm); font-weight: 600;
      text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
    }
    .sugg-finish { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }
    .btn--sm { min-height: 40px; padding: var(--space-1) var(--space-4); font-size: var(--text-sm); }
    /* Tabs: one row on wide screens; three rows of two on phones.
       The 1px gap shows the background through, which draws the dividing lines. */
    #tabs { gap: 1px; background: var(--border-strong); }
    #tabs button { border-left: 0; }
    @media (max-width: 600px) {
      #tabs { grid-auto-flow: row; grid-template-columns: 1fr 1fr; }
    }

    /* ---- Parking photos ---- */
    .photo-list { display: grid; gap: var(--space-2); margin-bottom: var(--space-2); }
    .photo-item {
      display: grid; grid-template-columns: 88px 1fr; gap: var(--space-3); align-items: start;
      padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
    }
    .photo-item img { width: 88px; height: 88px; object-fit: cover; border-radius: var(--radius-sm); background: var(--surface-2); }
    .photo-item input { width: 100%; }
    .photo-tools { display: flex; flex-wrap: wrap; gap: 0 var(--space-3); align-items: center; }
    .photo-status { color: var(--text-muted); font-size: var(--text-xs); }
    .add-photo { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; }

    /* ---- Data checks ---- */
    #checksView, #usageView, #listView { min-width: 0; }
    .dq { min-width: 0; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); }
    .dq__head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
    .dq__head h3 { margin: 0; font-size: var(--text-md); }
    .dq__why { color: var(--text-muted); font-size: var(--text-sm); margin: var(--space-1) 0 0; }
    .dq .admin-list { margin-top: var(--space-3); }
    .dq .badge { flex: none; }

    /* ---- Usage report ---- */
    .tile__sub { color: var(--text-muted); font-size: var(--text-xs); margin-top: 2px; }
    .usage-tiles .tile__value { color: var(--text); }
    .usage-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-4); }
    .usage-card h3 { margin: 0; font-size: var(--text-md); }
    .usage-card .hint { color: var(--text-muted); font-size: var(--text-sm); margin: var(--space-1) 0 var(--space-3); }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .bar { fill: var(--brand-text); }
    .chart .bar.is-dim { opacity: .35; }
    .chart .grid { stroke: var(--border); stroke-width: 1; }
    .chart .base { stroke: var(--border-strong); stroke-width: 1; }
    .chart text { fill: var(--text-muted); font-size: 12px; font-family: inherit; }
    .chart .hit { fill: transparent; cursor: pointer; }
    .chart-tip {
      position: absolute; top: 0; pointer-events: none; z-index: 2;
      background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm); box-shadow: 0 4px 14px rgb(0 0 0 / .18);
      padding: var(--space-2) var(--space-3); font-size: var(--text-sm); white-space: nowrap;
    }
    .chart-tip strong { display: block; }
    .chart-tip span { color: var(--text-muted); }
    .usage-card details { margin-top: var(--space-3); }
    .usage-card summary { color: var(--brand-text); font-weight: 600; font-size: var(--text-sm); cursor: pointer; min-height: 40px; display: flex; align-items: center; }
    .usage-card .table { font-size: var(--text-sm); }
    .usage-also { color: var(--text-muted); font-size: var(--text-sm); margin: 0; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__title" href="admin.html">Doug's Parking App</a>
      <nav class="app-header__nav" aria-label="Main">
        <a href="index.html">View app</a>
        <a href="admin.html" aria-current="page">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container stack stack--lg">

    <!-- ============ SIGN IN ============ -->
    <section id="signInView" hidden>
      <form id="signInForm" class="form-panel">
        <h1>Admin sign in</h1>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="signInError" class="field__error" role="alert"></div>
        <button class="btn btn--primary btn--block" type="submit">Sign in</button>
      </form>
    </section>

    <!-- ============ ADMIN ============ -->
    <section id="adminView" class="stack" hidden>
      <div class="row row--between">
        <div class="segmented" role="group" aria-label="What to edit" id="tabs">
          <button type="button" data-tab="suggestions" id="suggestionsTab">Suggestions</button>
          <button type="button" data-tab="wards">Wards</button>
          <button type="button" data-tab="parking">Parking</button>
          <button type="button" data-tab="hospitals">Hospitals</button>
          <button type="button" data-tab="usage">Usage</button>
          <button type="button" data-tab="checks" id="checksTab">Checks</button>
        </div>
        <button id="signOutButton" class="btn btn--ghost" type="button">Sign out</button>
      </div>

      <div id="message" role="status"></div>

      <!-- List -->
      <div id="listView" class="stack">
        <div class="field-row">
          <div class="field" id="hospitalFilterField">
            <label for="hospitalFilter">Hospital</label>
            <select id="hospitalFilter"></select>
          </div>
          <div class="field">
            <label for="listSearch">Search</label>
            <input id="listSearch" type="search" autocomplete="off">
          </div>
        </div>
        <div class="row row--between">
          <span id="listCount" class="status-line"></span>
          <button id="addButton" class="btn btn--primary" type="button">Add</button>
          <button id="finishedButton" class="btn btn--ghost" type="button" hidden>Show finished</button>
        </div>
        <div id="list" class="admin-list"></div>
      </div>

      <!-- Usage report -->
      <div id="usageView" class="stack" hidden>
        <div class="segmented" role="group" aria-label="Period" id="periods">
          <button type="button" data-days="7">Last 7 days</button>
          <button type="button" data-days="30" aria-pressed="true">Last 30 days</button>
          <button type="button" data-days="90">Last 90 days</button>
        </div>
        <div id="usageBody" class="stack"></div>
      </div>

      <!-- Data checks -->
      <div id="checksView" class="stack" hidden></div>

      <!-- Edit form (built per item) -->
      <form id="editView" class="form-panel" hidden novalidate></form>
    </section>

    <p id="loading" class="status-line">Loading…</p>
  </main>

  <script>
    /* =================================================================
       SUPABASE CONNECTION – same two values as index.html
       ================================================================= */
    const SUPABASE_URL = "https://vruayefwgzwlwestsedo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_AWpInxkGOBc1bWFsJQjB_g_vBKftpm9";

    const $ = id => document.getElementById(id);
    let db = null;
    let tab = "suggestions";
    let hospitals = [], parking = [], wards = [], suggestions = [], photos = [], diagrams = [];
    const PHOTO_BUCKET = "parking-photos";
    let showFinished = false;

    /* ---------- Helpers ---------- */

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function blankToNull(value) {
      const v = String(value == null ? "" : value).trim();
      return v === "" ? null : v;
    }

    function showMessage(text, kind = "ok") {
      $("message").innerHTML = text ? `<div class="alert alert--${kind}">${escapeHtml(text)}</div>` : "";
      if (text && kind === "ok") setTimeout(() => { $("message").innerHTML = ""; }, 4000);
    }

    function friendlyError(error) {
      const msg = (error && error.message) || String(error);
      if (/duplicate key|unique/i.test(msg)) return "That name is already used at this hospital.";
      if (/row-level security|permission denied/i.test(msg)) return "Your account isn't allowed to make changes.";
      if (/not at this ward's hospital/i.test(msg)) return "That parking spot belongs to a different hospital.";
      return msg;
    }

    const hospitalName = id => (hospitals.find(h => h.id === id) || {}).name || "?";
    const parkingName = id => (parking.find(p => p.id === id) || {}).name || "";

    /* Accepts "51.7731968, 0.4663185", or a Google Maps link containing the coordinates */
    function parseCoordinates(text) {
      const match = String(text || "").match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
      if (!match) return null;
      const lat = Number(match[1]), lng = Number(match[2]);
      if (lat < 49 || lat > 61 || lng < -9 || lng > 3) return null;   // UK only
      return { lat, lng };
    }

    /* ---------- Data ---------- */

    async function loadAll() {
      const [h, p, w, s, ph, dg] = await Promise.all([
        db.from("hospitals").select("*").order("name"),
        db.from("parking_locations").select("*").order("name"),
        db.from("wards").select("*").order("name"),
        db.from("suggestions").select("*").order("created_at", { ascending: false }).limit(300),
        db.from("parking_photos").select("*").order("sort_order"),
        db.from("diagrams").select("id, hospital_id")
      ]);
      for (const r of [h, p, w, s]) if (r.error) throw r.error;
      hospitals = h.data; parking = p.data; wards = w.data; suggestions = s.data;
      photos = ph.error ? [] : ph.data;      // empty until 07_photos.sql has been run
      diagrams = dg.error ? [] : dg.data;
      updateChecksCount();
      updateSuggestionCount();
    }

    function updateSuggestionCount() {
      const n = suggestions.filter(x => x.status === "Pending").length;
      $("suggestionsTab").textContent = n ? `Suggestions (${n})` : "Suggestions";
      if (typeof updateChecksCount === "function" && hospitals.length) updateChecksCount();
    }

    async function save(table, id, row) {
      const query = id
        ? db.from(table).update(row).eq("id", id)
        : db.from(table).insert(row);
      const { error } = await query.select().single();
      if (error) throw error;
      await loadAll();
    }

    /* ---------- List view ---------- */

    function fillHospitalFilter() {
      const current = $("hospitalFilter").value;
      $("hospitalFilter").innerHTML = '<option value="">All hospitals</option>' +
        hospitals.map(h => `<option value="${h.id}">${escapeHtml(h.name)}</option>`).join("");
      $("hospitalFilter").value = current;
    }

    function renderList() {
      $("hospitalFilterField").hidden = tab === "hospitals";
      $("addButton").hidden = tab === "suggestions";
      $("finishedButton").hidden = tab !== "suggestions";
      if (tab === "suggestions") { renderSuggestions(); return; }
      $("addButton").textContent = { wards: "Add ward", parking: "Add parking spot", hospitals: "Add hospital" }[tab];

      const hospitalId = Number($("hospitalFilter").value) || null;
      const search = $("listSearch").value.trim().toLowerCase();
      const matches = (text) => !search || text.toLowerCase().includes(search);

      let items = [];
      if (tab === "wards") {
        items = wards
          .filter(w => !hospitalId || w.hospital_id === hospitalId)
          .filter(w => matches(`${w.name} ${w.notes || ""} ${parkingName(w.parking_location_id)}`))
          .map(w => ({
            id: w.id, title: w.name, active: w.active,
            sub: `${hospitalName(w.hospital_id)} · ${w.parking_location_id ? "Park at " + parkingName(w.parking_location_id) : "No parking set"}`
          }));
      } else if (tab === "parking") {
        items = parking
          .filter(p => !hospitalId || p.hospital_id === hospitalId)
          .filter(p => matches(`${p.name} ${p.driver_notes || ""}`))
          .map(p => {
            const used = wards.filter(w => w.parking_location_id === p.id).length;
            const pics = photos.filter(x => x.parking_location_id === p.id).length;
            return { id: p.id, title: p.name, active: p.active,
                     sub: `${hospitalName(p.hospital_id)} · used by ${used} ward${used === 1 ? "" : "s"}` +
                          (pics ? ` · ${pics} photo${pics === 1 ? "" : "s"}` : "") };
          });
      } else {
        items = hospitals
          .filter(h => matches(h.name))
          .map(h => {
            const n = wards.filter(w => w.hospital_id === h.id).length;
            return { id: h.id, title: h.name, active: h.active, sub: `${n} ward${n === 1 ? "" : "s"}` };
          });
      }

      $("listCount").textContent = `${items.length} ${items.length === 1 ? "item" : "items"}`;
      $("list").innerHTML = items.length
        ? items.map(i => `
            <button type="button" class="admin-row" data-id="${i.id}">
              <span class="admin-row__main">
                <span class="admin-row__title">${escapeHtml(i.title)}</span>
                ${i.active ? "" : ' <span class="badge badge--neutral">Hidden</span>'}
                <div class="admin-row__sub">${escapeHtml(i.sub)}</div>
              </span>
              <span class="admin-row__chev" aria-hidden="true">›</span>
            </button>`).join("")
        : '<div class="empty">Nothing matches.</div>';
    }

    function setTab(next) {
      returnTo = null;
      tab = next;
      document.querySelectorAll("#tabs button").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
      $("listSearch").value = "";
      if (tab === "usage") showUsage();
      else if (tab === "checks") showChecks();
      else showList();
    }

    function showList() {
      $("editView").hidden = true;
      $("usageView").hidden = true;
      $("checksView").hidden = true;
      $("listView").hidden = false;
      renderList();
    }

    /* ---------- Data checks ----------
       Each check lists the items that need a look. "important" ones are counted on the tab. */

    let noResultSearches = [];      // filled from the usage report when Checks is opened

    function buildChecks() {
      const activeHospital = id => (hospitals.find(h => h.id === id) || {}).active;
      const spot = id => parking.find(p => p.id === id);
      const shownWards = wards.filter(w => w.active && activeHospital(w.hospital_id));
      const usedSpots = parking.filter(p => p.active && shownWards.some(w => w.parking_location_id === p.id));
      const weekAgo = Date.now() - 7 * 86400000;
      const wardRow = w => ({ tab: "wards", id: w.id, title: w.name, sub: hospitalName(w.hospital_id) });
      const spotRow = p => ({ tab: "parking", id: p.id, title: p.name, sub: hospitalName(p.hospital_id) });

      return [
        {
          important: true,
          title: "Wards with no parking shown",
          why: "Crews see “Parking location not yet available”. Either no spot is set, or the spot is hidden.",
          items: shownWards.filter(w => !w.parking_location_id || !(spot(w.parking_location_id) || {}).active).map(wardRow)
        },
        {
          important: true,
          title: "Suggestions waiting over a week",
          why: "Crew suggestions not yet marked Done or Dismissed.",
          items: suggestions.filter(x => x.status === "Pending" && new Date(x.created_at).getTime() < weekAgo)
            .map(x => ({ tab: "suggestions", id: x.id, title: x.kind, sub: `${formatWhen(x.created_at)} · ${String(x.message || "").slice(0, 60)}` }))
        },
        {
          important: true,
          title: "Searches that keep finding nothing",
          why: "Searched 3 or more times in the last 30 days with no results – a missing ward, or a name crews use.",
          items: noResultSearches.filter(r => r.times >= 3)
            .map(r => ({ title: `“${r.text}”`, sub: `${r.times} times · last ${formatWhen(r.last_time)}` }))
        },
        {
          title: "Parking spots with no photos",
          why: "Spots crews use that don't have a photo yet.",
          items: usedSpots.filter(p => !photos.some(x => x.parking_location_id === p.id)).map(spotRow)
        },
        {
          title: "Parking spots with no driver notes",
          why: "Spots crews use with no notes on where exactly to stop.",
          items: usedSpots.filter(p => !p.driver_notes).map(spotRow)
        },
        {
          title: "Parking spots no ward uses",
          why: "Shown spots that no ward points to. Link them to a ward, or hide them.",
          items: parking.filter(p => p.active && !shownWards.some(w => w.parking_location_id === p.id)).map(spotRow)
        },
        {
          title: "Hospitals with no diagram",
          why: "Crews see “No diagram” on every ward at these hospitals.",
          items: hospitals.filter(h => h.active && !diagrams.some(d => d.hospital_id === h.id))
            .map(h => ({ tab: "hospitals", id: h.id, title: h.name, sub: "Diagrams are added outside admin for now" }))
        }
      ];
    }

    function updateChecksCount() {
      const n = buildChecks().filter(c => c.important && c.items.length).length;
      $("checksTab").textContent = n ? `Checks (${n})` : "Checks";
    }

    const expandedChecks = new Set();

    function renderChecks() {
      const checks = buildChecks();
      updateChecksCount();
      $("checksView").innerHTML = `
        <p class="status-line" style="margin:0">Things worth a look. The first three matter most and are counted on the tab.</p>
        ${checks.map((c, i) => {
          const n = c.items.length;
          const badge = !n ? '<span class="badge badge--ok">All good</span>'
            : `<span class="badge ${c.important ? "badge--warn" : "badge--neutral"}">${n}</span>`;
          const showAll = expandedChecks.has(i);
          const shown = showAll ? c.items : c.items.slice(0, 5);
          return `
            <section class="dq">
              <div class="dq__head"><h3>${escapeHtml(c.title)}</h3>${badge}</div>
              <p class="dq__why">${escapeHtml(c.why)}</p>
              ${n ? `<div class="admin-list">${shown.map(it => it.tab ? `
                <button type="button" class="admin-row" data-check-tab="${it.tab}" data-id="${it.id}">
                  <span class="admin-row__main"><span class="admin-row__title">${escapeHtml(it.title)}</span>
                    <div class="admin-row__sub">${escapeHtml(it.sub)}</div></span>
                  <span class="admin-row__chev" aria-hidden="true">›</span>
                </button>` : `
                <div class="admin-row" style="cursor:default">
                  <span class="admin-row__main"><span class="admin-row__title">${escapeHtml(it.title)}</span>
                    <div class="admin-row__sub">${escapeHtml(it.sub)}</div></span>
                </div>`).join("")}</div>
                ${n > 5 ? `<button class="link-btn" type="button" data-check-more="${i}">${showAll ? "Show fewer" : `Show all ${n}`}</button>` : ""}` : ""}
            </section>`;
        }).join("")}`;
    }

    async function showChecks() {
      $("editView").hidden = true;
      $("listView").hidden = true;
      $("usageView").hidden = true;
      $("checksView").hidden = false;
      renderChecks();
      await loadNoResultSearches();
    }

    /* The "found nothing" searches come from the usage report */
    async function loadNoResultSearches() {
      const { data, error } = await db.rpc("usage_summary", { days: 30 });
      if (error || !data) return;
      const summary = typeof data === "string" ? JSON.parse(data) : data;
      noResultSearches = summary.no_results || [];
      updateChecksCount();
      if (tab === "checks" && !$("checksView").hidden) renderChecks();
    }

    $("checksView").addEventListener("click", event => {
      const more = event.target.closest("[data-check-more]");
      if (more) {
        const i = Number(more.dataset.checkMore);
        if (expandedChecks.has(i)) expandedChecks.delete(i); else expandedChecks.add(i);
        renderChecks();
        return;
      }
      const row = event.target.closest("[data-check-tab]");
      if (!row) return;
      const target = row.dataset.checkTab, id = Number(row.dataset.id);
      if (target === "suggestions") { setTab("suggestions"); return; }
      openFrom(target, id, {}, "checks");
    });

    /* ---------- Usage report ---------- */

    let usageDays = 30;
    let usage = null;          // last summary loaded
    let chartData = null;
    const fmt = n => Number(n || 0).toLocaleString("en-GB");
    const plural = (n, one, many = one + "s") => `${fmt(n)} ${Number(n) === 1 ? one : many}`;

    function showUsage() {
      $("editView").hidden = true;
      $("listView").hidden = true;
      $("checksView").hidden = true;
      $("usageView").hidden = false;
      loadUsage();
    }

    async function loadUsage() {
      document.querySelectorAll("#periods button").forEach(b =>
        b.setAttribute("aria-pressed", String(Number(b.dataset.days) === usageDays)));
      $("usageBody").innerHTML = '<p class="status-line">Loading…</p>';
      const { data, error } = await db.rpc("usage_summary", { days: usageDays });
      if (error) {
        const missing = /usage_summary|function|schema cache/i.test(error.message || "");
        $("usageBody").innerHTML = `<div class="alert alert--warn">${missing
          ? "The usage report isn't switched on yet. Run <strong>07_photos.sql</strong> in Supabase's SQL Editor, then come back here."
          : escapeHtml(friendlyError(error))}</div>`;
        return;
      }
      usage = typeof data === "string" ? JSON.parse(data) : data;
      renderUsage();
    }

    /* Today's date in the UK, as "YYYY-MM-DD" */
    function ukToday() {
      return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London" }).format(new Date());
    }
    function shortDate(ymd) {
      return new Date(ymd + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
    }
    function longDate(ymd) {
      return new Date(ymd + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
    }

    /* One entry per day in the period, with zeros for quiet days */
    function fillDays(byDay, days) {
      const found = new Map(byDay.map(d => [d.day, d]));
      const end = new Date(ukToday() + "T12:00:00Z");
      const out = [];
      for (let i = days - 1; i >= 0; i--) {
        const day = new Date(end.getTime() - i * 86400000).toISOString().slice(0, 10);
        out.push(found.get(day) || { day, phones: 0, searches: 0, navigate: 0 });
      }
      return out;
    }

    const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const pct = (n, total) => total ? Math.round((n / total) * 100) + "%" : "–";

    function secondsText(sec) {
      if (sec == null) return "–";
      sec = Math.round(sec);
      return sec < 90 ? `${sec} seconds` : `${Math.round(sec / 60)} minutes`;
    }

    /* A small "share" table: label, phones, % of phones */
    function shareTable(title, counts, labels) {
      const total = Object.values(counts || {}).reduce((a, b) => a + b, 0);
      const rows = Object.keys(labels)
        .filter(k => counts && counts[k])
        .map(k => `<tr><td>${labels[k]}</td><td class="num">${fmt(counts[k])}</td><td class="num">${pct(counts[k], total)}</td></tr>`).join("");
      return `<div class="table-wrap"><table class="table">
        <thead><tr><th>${title}</th><th class="num">Phones</th><th class="num">Share</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="3" class="muted">Not recorded yet</td></tr>'}</tbody></table></div>`;
    }

    function chartCard(id, title, hint) {
      return `<section class="usage-card"><h3>${title}</h3><p class="hint">${hint}</p><div class="chart" id="${id}"></div></section>`;
    }

    function renderUsage() {
      const t = usage.totals || {};
      const v = usage.visits || {};
      const returning = Math.max(0, (t.phones || 0) - (t.new_phones || 0));
      const days = fillDays(usage.by_day || [], usageDays);
      const nothingYet = !t.phones && !t.searches;

      const noResults = usage.no_results || [];
      const topWards = usage.top_wards || [];
      const byHospital = usage.by_hospital || [];
      const loyal = usage.loyalty || {};
      const dev = usage.devices || {};

      const hourMap = new Map((usage.by_hour || []).map(r => [r.hour, r.uses]));
      // Crews work roughly 05:30 to 02:00, so the chart runs 05:00 → 02:00 (crossing midnight).
      // If anything is ever used between 02:00 and 05:00, it shows the whole 24 hours instead.
      const night = [2, 3, 4].some(h => hourMap.get(h));
      const hourOrder = night ? Array.from({ length: 24 }, (_, h) => h)
                              : [...Array.from({ length: 19 }, (_, i) => i + 5), 0, 1];
      const hours = hourOrder.map(h => ({
        hour: h,
        value: hourMap.get(h) || 0,
        title: `${String(h).padStart(2, "0")}:00 – ${String((h + 1) % 24).padStart(2, "0")}:00`,
        detail: plural(hourMap.get(h) || 0, "search or tap", "searches and taps")
      }));
      const dayMap = new Map((usage.by_weekday || []).map(r => [r.weekday, r.uses]));
      const weekdays = WEEKDAYS.map((name, i) => ({
        value: dayMap.get(i + 1) || 0,
        title: name,
        detail: plural(dayMap.get(i + 1) || 0, "search or tap", "searches and taps")
      }));

      $("usageBody").innerHTML = `
        <div class="tiles usage-tiles">
          <div class="tile"><div class="tile__value">${fmt(t.phones)}</div><div class="tile__label">Phones used the app</div>
            <div class="tile__sub">${fmt(t.new_phones)} new · ${fmt(returning)} returning</div></div>
          <div class="tile"><div class="tile__value">${fmt(t.searches)}</div><div class="tile__label">Searches</div></div>
          <div class="tile"><div class="tile__value">${fmt(t.navigate)}</div><div class="tile__label">Navigate taps</div></div>
          <div class="tile"><div class="tile__value">${fmt(t.map)}</div><div class="tile__label">Map taps</div></div>
        </div>
        <p class="usage-also">Also ${plural(t.diagram, "hospital diagram")} opened, ${plural(t.photo, "parking photo")} viewed, ${plural(t.call, "phone number")} tapped,
          the feedback form opened ${plural(t.feedback, "time")},
          ${plural(t.share, "ward link")} shared and ${plural(t.shared_open, "shared link")} opened.
          Phones are counted anonymously – the app never knows who is using it.</p>

        ${nothingYet ? '<div class="empty">No use recorded in this period yet.</div>' : `
        <section class="usage-card">
          <h3>Phones using the app each day</h3>
          <p class="hint">Tap or point at a day for its details.</p>
          <div class="chart" id="dayChart"></div>
          <details>
            <summary>Show as a table</summary>
            <div class="table-wrap"><table class="table">
              <thead><tr><th>Day</th><th class="num">Phones</th><th class="num">Searches</th><th class="num">Navigate</th></tr></thead>
              <tbody>${days.slice().reverse().map(d => `
                <tr><td>${longDate(d.day)}</td><td class="num">${fmt(d.phones)}</td><td class="num">${fmt(d.searches)}</td><td class="num">${fmt(d.navigate)}</td></tr>`).join("")}
              </tbody></table></div>
          </details>
        </section>`}

        <section class="usage-card">
          <h3>Searches that found nothing</h3>
          <p class="hint">Could be a missing ward, or a name crews know it by. Search words are deleted after 90 days.</p>
          ${noResults.length ? `<div class="table-wrap"><table class="table">
            <thead><tr><th>Searched for</th><th class="num">Times</th><th>Last</th></tr></thead>
            <tbody>${noResults.map(r => `
              <tr><td>${escapeHtml(r.text)}</td><td class="num">${fmt(r.times)}</td><td>${formatWhen(r.last_time)}</td></tr>`).join("")}
            </tbody></table></div>` : '<div class="empty">None – every search found something.</div>'}
        </section>

        <section class="usage-card">
          <h3>Most used wards</h3>
          <p class="hint">Taps on Map, Navigate, diagram, photos or phone number.</p>
          ${topWards.length ? `<div class="table-wrap"><table class="table">
            <thead><tr><th>Ward</th><th class="num">Taps</th><th class="num">Navigate</th></tr></thead>
            <tbody>${topWards.map(r => `
              <tr><td>${escapeHtml(r.ward)}<div class="muted small">${escapeHtml(r.hospital)}</div></td>
                  <td class="num">${fmt(r.taps)}</td><td class="num">${fmt(r.navigate)}</td></tr>`).join("")}
            </tbody></table></div>` : '<div class="empty">No ward taps yet.</div>'}
        </section>

        ${nothingYet ? "" : `
        <h2 class="section-title">More detail</h2>

        <section class="usage-card">
          <h3>What happens on a visit</h3>
          <p class="hint">A visit starts when the app is opened, or come back to after 30 minutes or more.</p>
          ${v.visits ? `<div class="table-wrap"><table class="table"><tbody>
            <tr><td>Visits</td><td class="num">${fmt(v.visits)}</td><td class="num"></td></tr>
            <tr><td>Tapped Navigate</td><td class="num">${fmt(v.navigated)}</td><td class="num">${pct(v.navigated, v.visits)}</td></tr>
            <tr><td>Tapped Map, photos, diagram or phone (not Navigate)</td><td class="num">${fmt((v.tapped || 0) - (v.navigated || 0))}</td><td class="num">${pct((v.tapped || 0) - (v.navigated || 0), v.visits)}</td></tr>
            <tr><td>Searched, then tapped nothing</td><td class="num">${fmt(v.searched_no_tap)}</td><td class="num">${pct(v.searched_no_tap, v.visits)}</td></tr>
            <tr><td>Opened, then did nothing</td><td class="num">${fmt(v.opened_only)}</td><td class="num">${pct(v.opened_only, v.visits)}</td></tr>
            <tr><td>Typical time from opening to Navigate</td><td class="num" colspan="2">${secondsText(v.median_seconds)}</td></tr>
          </tbody></table></div>` : '<div class="empty">Visits are recorded from now on – check back soon.</div>'}
        </section>

        ${chartCard("hourChart", "Busiest times of day", "Searches and taps in each hour, UK time.")}
        ${chartCard("weekdayChart", "Busiest days of the week", "Searches and taps on each day of the week.")}

        <section class="usage-card">
          <h3>Hospitals</h3>
          <p class="hint">Taps on Map, Navigate, diagram, photos or phone number.</p>
          ${byHospital.length ? `<div class="table-wrap"><table class="table">
            <thead><tr><th>Hospital</th><th class="num">Taps</th><th class="num">Share</th><th class="num">Navigate</th></tr></thead>
            <tbody>${byHospital.map(r => `
              <tr><td>${escapeHtml(r.hospital)}</td><td class="num">${fmt(r.taps)}</td>
                  <td class="num">${pct(r.taps, byHospital.reduce((a, x) => a + x.taps, 0))}</td><td class="num">${fmt(r.navigate)}</td></tr>`).join("")}
            </tbody></table></div>` : '<div class="empty">No taps yet.</div>'}
        </section>

        <section class="usage-card">
          <h3>How often phones come back</h3>
          <p class="hint">Number of different days each phone used the app in this period.</p>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Used on</th><th class="num">Phones</th><th class="num">Share</th></tr></thead>
            <tbody>
              <tr><td>1 day</td><td class="num">${fmt(loyal.one_day)}</td><td class="num">${pct(loyal.one_day, t.phones)}</td></tr>
              <tr><td>2 – 4 days</td><td class="num">${fmt(loyal.few_days)}</td><td class="num">${pct(loyal.few_days, t.phones)}</td></tr>
              <tr><td>5 days or more</td><td class="num">${fmt(loyal.regular)}</td><td class="num">${pct(loyal.regular, t.phones)}</td></tr>
            </tbody></table></div>
        </section>

        <section class="usage-card stack">
          <div><h3>Phones and settings</h3>
          <p class="hint" style="margin-bottom:0">Each phone counted once, using its most recent visit. Recorded from now on.</p></div>
          ${shareTable("Device", dev.device_type, { phone: "Phone", tablet: "Tablet", computer: "Computer" })}
          ${shareTable("Opened from", dev.launched_from, { "home screen": "Home-screen icon", browser: "Web browser" })}
          ${shareTable("Theme", dev.theme, { light: "Light", dark: "Dark" })}
        </section>`}`;

      chartData = nothingYet ? null : { days, hours, weekdays };
      drawCharts();
    }

    function drawCharts() {
      if (!chartData) return;
      const { days, hours, weekdays } = chartData;
      const last = days.length - 1;
      const dayTicks = days.length > 7 ? [0, Math.floor(last / 2), last] : [0, last];
      drawBars($("dayChart"), days.map(d => ({
          value: d.phones, title: longDate(d.day),
          detail: `${plural(d.phones, "phone")}<br><span>${plural(d.searches, "search", "searches")} · ${fmt(d.navigate)} Navigate</span>`
        })),
        dayTicks.map(i => ({ i, text: i === last ? "Today" : shortDate(days[i].day) })),
        "Bar chart of phones using the app each day. Full figures are in the table below.");
      drawBars($("hourChart"), hours,
        hours.map((x, i) => ({ i, h: x.hour }))
          .filter(t => (hours.length === 24 ? [0, 6, 12, 18] : [5, 12, 18]).includes(t.h) || t.i === hours.length - 1)
          // the last label marks where the chart ends (02:00, or midnight for the full day)
          .map(t => ({ i: t.i, text: String(t.i === hours.length - 1 ? (t.h + 1) % 24 : t.h).padStart(2, "0") + ":00" })),
        "Bar chart of searches and taps in each hour of the day.");
      drawBars($("weekdayChart"), weekdays,
        weekdays.map((w, i) => ({ i, text: w.title })),
        "Bar chart of searches and taps on each day of the week.");
    }

    /* Simple bar chart drawn as SVG.
       items: [{ value, title, detail }]   ticks: [{ i, text }] for the labels under the bars */
    function niceStep(max) {
      const raw = Math.max(1, max) / 4;
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const step = [1, 2, 5, 10].map(m => m * pow).find(s => s >= raw);
      return Math.max(1, step);
    }

    function drawBars(box, items, ticks, ariaLabel) {
      if (!box) return;
      const W = Math.max(280, box.clientWidth), H = 190;
      const m = { top: 10, right: 4, bottom: 24, left: 34 };
      const pw = W - m.left - m.right, ph = H - m.top - m.bottom;
      const max = Math.max(1, ...items.map(d => d.value));
      const step = niceStep(max);
      const top = Math.ceil(max / step) * step;
      const y = v => m.top + ph - (v / top) * ph;
      const band = pw / items.length;
      const barW = Math.min(36, Math.max(1, band - 2));      // 2px gap between bars

      let grid = "";
      for (let v = 0; v <= top; v += step) {
        grid += `<line class="${v === 0 ? "base" : "grid"}" x1="${m.left}" x2="${W - m.right}" y1="${y(v)}" y2="${y(v)}"/>
                 <text x="${m.left - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
      }

      let bars = "", hits = "";
      items.forEach((d, i) => {
        const x = m.left + i * band + (band - barW) / 2;
        const h = (d.value / top) * ph;
        if (h > 0) {
          const r = Math.min(4, barW / 2, h);                // rounded top, square at the baseline
          const yb = m.top + ph, yt = yb - h;
          bars += `<path class="bar" data-i="${i}" d="M${x},${yb} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + barW - r} Q${x + barW},${yt} ${x + barW},${yt + r} V${yb} Z"/>`;
        }
        hits += `<rect class="hit" data-i="${i}" x="${m.left + i * band}" y="${m.top}" width="${band}" height="${ph}"/>`;
      });

      // Labels under the bars; the first and last line up with the chart edges when there are many bars
      const many = items.length > 7;
      const labels = ticks.map((tk, k) => {
        const centre = m.left + tk.i * band + band / 2;
        let anchor = "middle", lx = centre;
        if (many && k === 0) { anchor = "start"; lx = m.left + tk.i * band; }
        if (many && k === ticks.length - 1) { anchor = "end"; lx = m.left + (tk.i + 1) * band; }
        return `<text x="${lx}" y="${H - 6}" text-anchor="${anchor}">${tk.text}</text>`;
      }).join("");

      box.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${escapeHtml(ariaLabel)}">
          ${grid}${bars}${labels}${hits}
        </svg>
        <div class="chart-tip" hidden></div>`;

      const tip = box.querySelector(".chart-tip");
      const svg = box.querySelector("svg");
      function show(i) {
        const d = items[i];
        tip.innerHTML = `<strong>${d.title}</strong>${d.detail}`;
        tip.hidden = false;
        svg.querySelectorAll(".bar").forEach(b => b.classList.toggle("is-dim", Number(b.dataset.i) !== i));
        const cx = m.left + i * band + band / 2;
        const tw = tip.offsetWidth;
        tip.style.left = Math.min(Math.max(0, cx - tw / 2), W - tw) + "px";
        tip.style.top = Math.max(0, y(d.value) - tip.offsetHeight - 8) + "px";
      }
      function hide() {
        tip.hidden = true;
        svg.querySelectorAll(".bar").forEach(b => b.classList.remove("is-dim"));
      }
      svg.addEventListener("pointerover", e => { const h = e.target.closest(".hit"); if (h) show(Number(h.dataset.i)); });
      svg.addEventListener("pointerdown", e => { const h = e.target.closest(".hit"); if (h) show(Number(h.dataset.i)); });
      svg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
    }

    document.querySelectorAll("#periods button").forEach(b => b.addEventListener("click", () => {
      usageDays = Number(b.dataset.days);
      loadUsage();
    }));

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (tab === "usage" && !$("usageView").hidden) drawCharts(); }, 200);
    });

    /* ---------- Suggestions from crews ---------- */

    function formatWhen(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " +
             d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }

    function renderSuggestions() {
      const hospitalId = Number($("hospitalFilter").value) || null;
      const search = $("listSearch").value.trim().toLowerCase();
      const finished = suggestions.filter(x => x.status !== "Pending").length;
      $("finishedButton").textContent = showFinished ? "Hide finished" : `Show finished (${finished})`;

      const items = suggestions
        .filter(x => showFinished || x.status === "Pending")
        .filter(x => !hospitalId || x.hospital_id === hospitalId)
        .filter(x => {
          if (!search) return true;
          const ward = wards.find(w => w.id === x.ward_id);
          return `${x.message} ${ward ? ward.name : ""}`.toLowerCase().includes(search);
        });

      $("listCount").textContent = `${items.length} ${items.length === 1 ? "suggestion" : "suggestions"}`;

      $("list").innerHTML = items.length ? items.map(x => {
        const ward = wards.find(w => w.id === x.ward_id);
        const parkingSpot = ward && ward.parking_location_id ? parking.find(p => p.id === ward.parking_location_id) : null;
        const hasCoords = x.suggested_latitude != null && x.suggested_longitude != null;
        const coords = hasCoords ? `${Number(x.suggested_latitude)}, ${Number(x.suggested_longitude)}` : "";
        const about = ward ? `${ward.name} – ${hospitalName(ward.hospital_id)}`
                           : (x.hospital_id ? hospitalName(x.hospital_id) : "Hospital not given");
        const status = x.status === "Approved" ? " · Done" : x.status === "Rejected" ? " · Dismissed" : "";

        const links = [
          ward ? `<button class="link-btn" type="button" data-s-action="ward" data-id="${x.id}">Open ward</button>` : "",
          x.kind === "Missing ward" ? `<button class="link-btn" type="button" data-s-action="newward" data-id="${x.id}">Add as new ward</button>` : "",
          hasCoords ? `<a class="link-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(coords)}" target="_blank" rel="noopener">View location</a>` : "",
          hasCoords && parkingSpot ? `<button class="link-btn" type="button" data-s-action="parking" data-id="${x.id}">Use for “${escapeHtml(parkingSpot.name)}”</button>` : "",
          hasCoords ? `<button class="link-btn" type="button" data-s-action="newparking" data-id="${x.id}">New parking spot here</button>` : ""
        ].join("");

        const finish = x.status === "Pending"
          ? `<button class="btn btn--ghost btn--sm" type="button" data-s-action="Rejected" data-id="${x.id}">Dismiss</button>
             <button class="btn btn--go btn--sm" type="button" data-s-action="Approved" data-id="${x.id}">Done</button>`
          : `<button class="btn btn--ghost btn--sm" type="button" data-s-action="Pending" data-id="${x.id}">Move back to new</button>`;

        return `
          <article class="card ${x.status === "Pending" ? "card--info" : "card--plain"}">
            <div class="sugg-meta">${escapeHtml(x.kind)} · ${formatWhen(x.created_at)}${status}</div>
            <h3 class="sugg-title">${escapeHtml(about)}</h3>
            <p class="suggestion-text">${escapeHtml(x.message)}</p>
            ${hasCoords ? '<div class="sugg-meta">Location sent with this suggestion</div>' : ""}
            ${links ? `<div class="sugg-links">${links}</div>` : ""}
            <div class="sugg-finish">${finish}</div>
          </article>`;
      }).join("") : `<div class="empty">${showFinished ? "No suggestions yet." : "No new suggestions."}</div>`;
    }

    async function setSuggestionStatus(id, status) {
      const { error } = await db.from("suggestions")
        .update({ status, reviewed_at: status === "Pending" ? null : new Date().toISOString() })
        .eq("id", id).select().single();
      if (error) throw error;
      const item = suggestions.find(x => x.id === id);
      if (item) item.status = status;
      updateSuggestionCount();
      renderList();
    }

    function openFrom(targetTab, id, prefill, from = "suggestions") {
      returnTo = from;
      tab = targetTab;
      document.querySelectorAll("#tabs button").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
      openEditor(id, prefill);
    }

    $("finishedButton").addEventListener("click", () => { showFinished = !showFinished; renderList(); });

    $("list").addEventListener("click", async event => {
      const button = event.target.closest("[data-s-action]");
      if (!button) return;
      const x = suggestions.find(s => s.id === Number(button.dataset.id));
      if (!x) return;
      const action = button.dataset.sAction;
      const coords = x.suggested_latitude != null ? `${Number(x.suggested_latitude)}, ${Number(x.suggested_longitude)}` : "";
      const ward = wards.find(w => w.id === x.ward_id);

      try {
        if (["Approved", "Rejected", "Pending"].includes(action)) {
          button.disabled = true;
          await setSuggestionStatus(x.id, action);
          showMessage(action === "Approved" ? "Marked as done." : action === "Rejected" ? "Dismissed." : "Moved back to new.");
        } else if (action === "ward") {
          openFrom("wards", ward.id);
        } else if (action === "parking") {
          openFrom("parking", ward.parking_location_id, { coords });
        } else if (action === "newparking") {
          openFrom("parking", null, { coords, hospitalId: x.hospital_id || (ward && ward.hospital_id) });
        } else if (action === "newward") {
          const name = (x.message.match(/^Ward:\s*(.+)$/m) || [])[1] || "";
          openFrom("wards", null, { name, hospitalId: x.hospital_id });
        }
      } catch (error) {
        showMessage(friendlyError(error), "danger");
        button.disabled = false;
      }
    });

    /* ---------- Parking photos ---------- */

    const CAMERA_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';

    const photoUrl = path => db.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;
    const spotPhotos = spotId => photos
      .filter(x => x.parking_location_id === spotId)
      .sort((a, b) => a.sort_order - b.sort_order || a.id - b.id);

    function renderPhotoList(spotId) {
      const list = $("photoList");
      if (!list) return;
      const items = spotPhotos(spotId);
      list.innerHTML = items.length ? items.map((x, i) => `
        <div class="photo-item" data-photo="${x.id}">
          <a href="${escapeHtml(photoUrl(x.file_path))}" target="_blank" rel="noopener"><img src="${escapeHtml(photoUrl(x.file_path))}" alt="Photo ${i + 1}" loading="lazy"></a>
          <div>
            <label class="visually-hidden" for="cap-${x.id}">Caption for photo ${i + 1}</label>
            <input id="cap-${x.id}" data-caption="${x.id}" maxlength="120" value="${escapeHtml(x.caption || "")}"
                   placeholder="Caption, e.g. Use the right-hand door">
            <div class="photo-tools">
              ${i > 0 ? `<button class="link-btn" type="button" data-photo-move="-1" data-id="${x.id}">Move up</button>` : ""}
              ${i < items.length - 1 ? `<button class="link-btn" type="button" data-photo-move="1" data-id="${x.id}">Move down</button>` : ""}
              <button class="link-btn" type="button" data-photo-remove="${x.id}">Remove</button>
              <span class="photo-status" id="ps-${x.id}" role="status"></span>
            </div>
          </div>
        </div>`).join("") : '<div class="field__hint" style="margin:0">No photos yet.</div>';
    }

    /* Shrink a phone photo to max 1600px on the long side, as a JPEG of roughly 200–400 KB */
    async function shrinkPhoto(file) {
      let source;
      try {
        source = await createImageBitmap(file, { imageOrientation: "from-image" });
      } catch (e) {
        source = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("That file doesn't look like a photo."));
          img.src = URL.createObjectURL(file);
        });
      }
      const w = source.width, h = source.height;
      const scale = Math.min(1, 1600 / Math.max(w, h));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.8));
      if (!blob) throw new Error("Couldn't prepare that photo.");
      return blob;
    }

    async function addPhoto(spotId, file) {
      const blob = await shrinkPhoto(file);
      const path = `spot-${spotId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const up = await db.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
      if (up.error) throw up.error;
      const order = Math.max(0, ...spotPhotos(spotId).map(x => x.sort_order)) + 1;
      const { data, error } = await db.from("parking_photos")
        .insert({ parking_location_id: spotId, file_path: path, sort_order: order }).select().single();
      if (error) {
        await db.storage.from(PHOTO_BUCKET).remove([path]);
        throw error;
      }
      photos.push(data);
    }

    async function removePhoto(id) {
      const x = photos.find(p => p.id === id);
      const { error } = await db.from("parking_photos").delete().eq("id", id);
      if (error) throw error;
      await db.storage.from(PHOTO_BUCKET).remove([x.file_path]);
      photos = photos.filter(p => p.id !== id);
    }

    async function movePhoto(id, step) {
      const x = photos.find(p => p.id === id);
      const items = spotPhotos(x.parking_location_id);
      const from = items.indexOf(x), to = from + step;
      if (to < 0 || to >= items.length) return;
      items.splice(to, 0, items.splice(from, 1)[0]);
      for (let i = 0; i < items.length; i++) {
        if (items[i].sort_order !== i + 1) {
          const { error } = await db.from("parking_photos").update({ sort_order: i + 1 }).eq("id", items[i].id);
          if (error) throw error;
          items[i].sort_order = i + 1;
        }
      }
    }

    function photoError(error) {
      const msg = friendlyError(error);
      if (/bucket|not found|parking_photos/i.test(msg)) return "Photos aren't switched on yet – run 07_photos.sql in Supabase first.";
      if (/size|too large|exceeded/i.test(msg)) return "That photo is too big.";
      return msg;
    }

    $("editView").addEventListener("change", async event => {
      const spotId = editing && editing.table === "parking_locations" ? editing.id : null;
      if (!spotId) return;

      if (event.target.id === "photoInput") {
        const file = event.target.files && event.target.files[0];
        event.target.value = "";
        if (!file) return;
        $("formError").textContent = "";
        $("addPhotoText").textContent = "Uploading…";
        try {
          await addPhoto(spotId, file);
          renderPhotoList(spotId);
        } catch (error) {
          $("formError").textContent = photoError(error);
        }
        $("addPhotoText").textContent = "Add photo";
      }

      const captionId = Number(event.target.dataset.caption);
      if (captionId) {
        const caption = blankToNull(event.target.value);
        const status = $(`ps-${captionId}`);
        const { error } = await db.from("parking_photos").update({ caption }).eq("id", captionId);
        if (error) { status.textContent = photoError(error); return; }
        photos.find(p => p.id === captionId).caption = caption;
        status.textContent = "Caption saved";
        setTimeout(() => { status.textContent = ""; }, 2500);
      }
    });

    $("editView").addEventListener("click", async event => {
      const spotId = editing && editing.table === "parking_locations" ? editing.id : null;
      const move = event.target.closest("[data-photo-move]");
      const remove = event.target.closest("[data-photo-remove]");
      if (!spotId || (!move && !remove)) return;
      $("formError").textContent = "";
      try {
        if (move) {
          await movePhoto(Number(move.dataset.id), Number(move.dataset.photoMove));
          renderPhotoList(spotId);
        } else if (remove.dataset.confirm !== "yes") {
          // First tap asks; second tap removes
          remove.dataset.confirm = "yes";
          remove.textContent = "Tap again to remove";
          setTimeout(() => { if (remove.isConnected) { remove.dataset.confirm = ""; remove.textContent = "Remove"; } }, 4000);
        } else {
          remove.textContent = "Removing…";
          await removePhoto(Number(remove.dataset.photoRemove));
          renderPhotoList(spotId);
        }
      } catch (error) {
        $("formError").textContent = photoError(error);
      }
    });

    /* ---------- Edit forms ---------- */

    function hospitalOptions(selected) {
      return hospitals.map(h =>
        `<option value="${h.id}" ${h.id === selected ? "selected" : ""}>${escapeHtml(h.name)}${h.active ? "" : " (hidden)"}</option>`).join("");
    }

    function parkingOptions(hospitalId, selected) {
      return '<option value="">None yet (shows "Parking location not yet available")</option>' +
        parking.filter(p => p.hospital_id === hospitalId).map(p =>
          `<option value="${p.id}" ${p.id === selected ? "selected" : ""}>${escapeHtml(p.name)}${p.active ? "" : " (hidden)"}</option>`).join("");
    }

    const formButtons = `
      <div id="formError" class="field__error" role="alert"></div>
      <div class="row">
        <button class="btn btn--go" type="submit">Save</button>
        <button class="btn btn--ghost" type="button" data-action="cancel">Cancel</button>
      </div>`;

    function activeField(item, label) {
      return `
        <label class="dq"><input type="checkbox" name="active" ${!item || item.active ? "checked" : ""}> ${label}</label>
        <div class="field__hint" style="margin-top: calc(-1 * var(--space-3))">Untick to hide it from crews without deleting it.</div>`;
    }

    function wardForm(w, prefill = {}) {
      const hospitalId = w ? w.hospital_id : (prefill.hospitalId || Number($("hospitalFilter").value) || (hospitals[0] && hospitals[0].id));
      return `
        <h2>${w ? "Edit ward" : "Add ward"}</h2>
        <div class="field"><label for="f-hospital">Hospital</label>
          <select id="f-hospital" name="hospital_id">${hospitalOptions(hospitalId)}</select></div>
        <div class="field"><label for="f-name">Ward or department name</label>
          <input id="f-name" name="name" required value="${escapeHtml(w ? w.name : (prefill.name || ""))}"></div>
        <div class="field"><label for="f-floor">Floor</label>
          <input id="f-floor" name="floor" value="${escapeHtml(w ? w.floor : "")}"></div>
        <div class="field"><label for="f-parking">Park at</label>
          <select id="f-parking" name="parking_location_id">${parkingOptions(hospitalId, w ? w.parking_location_id : null)}</select>
          <div class="field__hint">Missing? Add it on the Parking tab first.</div></div>
        <div class="field"><label for="f-notes">Notes</label>
          <textarea id="f-notes" name="notes">${escapeHtml(w ? w.notes : "")}</textarea>
          <div class="field__hint">Use | to start a new line. Phone numbers become tappable.</div></div>
        ${activeField(w, "Show to crews")}
        ${formButtons}`;
    }

    function parkingForm(p, prefill = {}) {
      const hospitalId = p ? p.hospital_id : (prefill.hospitalId || Number($("hospitalFilter").value) || (hospitals[0] && hospitals[0].id));
      const coords = prefill.coords || (p ? `${Number(p.latitude)}, ${Number(p.longitude)}` : "");
      const used = p ? wards.filter(w => w.parking_location_id === p.id).length : 0;
      return `
        <h2>${p ? "Edit parking spot" : "Add parking spot"}</h2>
        ${prefill.coords ? `<div class="alert alert--info">Location from a crew suggestion is filled in below. Check the route, then Save.</div>` : ""}
        ${p ? `<p class="status-line">Used by ${used} ward${used === 1 ? "" : "s"}. Renaming is safe – the wards using it update automatically.</p>` : ""}
        <div class="field"><label for="f-hospital">Hospital</label>
          <select id="f-hospital" name="hospital_id" ${p && used ? "disabled" : ""}>${hospitalOptions(hospitalId)}</select></div>
        <div class="field"><label for="f-name">Name</label>
          <input id="f-name" name="name" required value="${escapeHtml(p ? p.name : "")}"></div>
        <div class="field"><label for="f-coords">Coordinates</label>
          <input id="f-coords" name="coords" inputmode="decimal" required value="${escapeHtml(coords)}"
                 placeholder="51.7731968, 0.4663185" aria-describedby="coords-hint">
          <div class="field__hint" id="coords-hint">Paste from Google Maps (long-press the spot). Put the pin on the road you want crews to arrive by.</div>
          <div class="row" style="margin-top: var(--space-2)">
            <button class="btn btn--secondary" type="button" data-action="locate">Use my location</button>
            <button class="btn btn--ghost" type="button" data-action="check">Check route in Google Maps</button>
          </div></div>
        <div class="field"><label for="f-driver">Driver notes</label>
          <textarea id="f-driver" name="driver_notes">${escapeHtml(p ? p.driver_notes : "")}</textarea>
          <div class="field__hint">Use | to start a new line. Start with **WARNING** for the amber box.</div></div>
        <div class="field"><label for="f-approach">Preferred approach (optional)</label>
          <input id="f-approach" name="preferred_approach" value="${escapeHtml(p ? p.preferred_approach : "")}" placeholder="e.g. From the A13 or A127"></div>
        <div class="field">
          <span class="label">Photos</span>
          ${p ? `
            <div id="photoList" class="photo-list"></div>
            <label class="btn btn--secondary add-photo" for="photoInput">${CAMERA_ICON}<span id="addPhotoText">Add photo</span></label>
            <input id="photoInput" type="file" accept="image/*" hidden>
            <div class="field__hint">Photos save straight away – no need to press Save. Crews see them on every ward that parks here. Avoid people's faces and number plates.</div>`
          : `<div class="field__hint">Save this parking spot first, then open it again to add photos.</div>`}
        </div>
        ${activeField(p, "Available to use")}
        ${formButtons}`;
    }

    function hospitalForm(h) {
      return `
        <h2>${h ? "Edit hospital" : "Add hospital"}</h2>
        <div class="field"><label for="f-name">Name</label>
          <input id="f-name" name="name" required value="${escapeHtml(h ? h.name : "")}"></div>
        ${activeField(h, "Show to crews")}
        ${formButtons}`;
    }

    let editing = null;   // { table, id }
    let returnTo = null;      // tab to go back to after Save / Cancel

    function openEditor(id, prefill = {}) {
      const form = $("editView");
      if (tab === "wards") {
        const w = id ? wards.find(x => x.id === id) : null;
        form.innerHTML = wardForm(w, prefill); editing = { table: "wards", id };
        $("f-hospital").addEventListener("change", () => {
          $("f-parking").innerHTML = parkingOptions(Number($("f-hospital").value), null);
        });
      } else if (tab === "parking") {
        const p = id ? parking.find(x => x.id === id) : null;
        form.innerHTML = parkingForm(p, prefill); editing = { table: "parking_locations", id };
        if (p) renderPhotoList(p.id);
      } else {
        const h = id ? hospitals.find(x => x.id === id) : null;
        form.innerHTML = hospitalForm(h); editing = { table: "hospitals", id };
      }
      $("listView").hidden = true;
      $("usageView").hidden = true;
      $("checksView").hidden = true;
      form.hidden = false;
      showMessage("");
      window.scrollTo(0, 0);
      $("f-name").focus();
    }

    function readForm() {
      const f = $("editView");
      const get = name => f.elements[name] ? f.elements[name].value : undefined;
      const active = f.elements.active.checked;
      const name = blankToNull(get("name"));
      if (!name) throw new Error("Please enter a name.");

      if (editing.table === "wards") {
        return {
          hospital_id: Number(get("hospital_id")),
          name,
          floor: blankToNull(get("floor")),
          parking_location_id: get("parking_location_id") ? Number(get("parking_location_id")) : null,
          notes: blankToNull(get("notes")),
          active
        };
      }
      if (editing.table === "parking_locations") {
        const c = parseCoordinates(get("coords"));
        if (!c) throw new Error("Coordinates must look like 51.7731968, 0.4663185 (UK only).");
        const row = {
          name,
          latitude: c.lat,
          longitude: c.lng,
          driver_notes: blankToNull(get("driver_notes")),
          preferred_approach: blankToNull(get("preferred_approach")),
          active
        };
        if (!f.elements.hospital_id.disabled) row.hospital_id = Number(get("hospital_id"));
        return row;
      }
      return { name, active };
    }

    $("editView").addEventListener("submit", async event => {
      event.preventDefault();
      const button = event.target.querySelector('[type="submit"]');
      $("formError").textContent = "";
      try {
        const row = readForm();
        button.disabled = true; button.textContent = "Saving…";
        await save(editing.table, editing.id, row);
        fillHospitalFilter();
        if (returnTo) setTab(returnTo); else showList();
        showMessage(`Saved “${row.name}”. Crews see the change next time they open the app.`);
      } catch (error) {
        $("formError").textContent = friendlyError(error);
        button.disabled = false; button.textContent = "Save";
      }
    });

    $("editView").addEventListener("click", event => {
      const action = event.target.closest("[data-action]");
      if (!action) return;
      const coordsInput = $("f-coords");

      if (action.dataset.action === "cancel") { if (returnTo) setTab(returnTo); else showList(); }

      if (action.dataset.action === "check") {
        const c = parseCoordinates(coordsInput.value);
        if (!c) { $("formError").textContent = "Enter coordinates first."; return; }
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}&travelmode=driving`, "_blank", "noopener");
      }

      if (action.dataset.action === "locate") {
        if (!navigator.geolocation) { $("formError").textContent = "Location isn't available on this device."; return; }
        action.textContent = "Finding you…";
        navigator.geolocation.getCurrentPosition(
          pos => {
            coordsInput.value = `${pos.coords.latitude.toFixed(7)}, ${pos.coords.longitude.toFixed(7)}`;
            action.textContent = "Use my location";
          },
          () => {
            $("formError").textContent = "Couldn't get your location – check location permission.";
            action.textContent = "Use my location";
          },
          { enableHighAccuracy: true, timeout: 15000 });
      }
    });

    $("list").addEventListener("click", event => {
      const row = event.target.closest(".admin-row");
      if (row) openEditor(Number(row.dataset.id));
    });

    $("addButton").addEventListener("click", () => openEditor(null));
    $("hospitalFilter").addEventListener("change", renderList);
    $("listSearch").addEventListener("input", renderList);
    document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

    /* ---------- Sign in / out ---------- */

    async function enterAdmin() {
      const { data, error } = await db.from("editors").select("user_id").limit(1);
      if (error || !data || data.length === 0) {
        await db.auth.signOut();
        showSignIn("This account isn't set up as an editor.");
        return;
      }
      await loadAll();
      fillHospitalFilter();
      $("signInView").hidden = true;
      $("adminView").hidden = false;
      $("loading").hidden = true;
      setTab(tab);
      loadNoResultSearches();      // so the Checks count includes them
    }

    function showSignIn(errorText = "") {
      $("adminView").hidden = true;
      $("loading").hidden = true;
      $("signInView").hidden = false;
      $("signInError").textContent = errorText;
    }

    $("signInForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = event.target.querySelector("button");
      button.disabled = true; button.textContent = "Signing in…";
      $("signInError").textContent = "";
      const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });
      button.disabled = false; button.textContent = "Sign in";
      if (error) { $("signInError").textContent = "Email or password not recognised."; return; }
      $("password").value = "";
      try { await enterAdmin(); } catch (e) { showSignIn(friendlyError(e)); }
    });

    $("signOutButton").addEventListener("click", async () => {
      await db.auth.signOut();
      showSignIn();
    });

    async function start() {
      if (SUPABASE_URL.startsWith("PASTE") || !window.supabase) {
        $("loading").textContent = "The Supabase project details haven't been added to admin.html yet.";
        return;
      }
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data } = await db.auth.getSession();
      if (data && data.session) {
        try { await enterAdmin(); } catch (e) { showSignIn(friendlyError(e)); }
      } else {
        showSignIn();
      }
    }

    start();
  </script>
</body>
</html>
