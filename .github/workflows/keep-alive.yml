# Keeps the free Supabase project awake (free projects pause after ~7 quiet days).
# Runs every 3 days. Edit the two values below to match index.html.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

env:
  SUPABASE_URL: "https://vruayefwgzwlwestsedo.supabase.co"
  SUPABASE_KEY: "sb_publishable_AWpInxkGOBc1bWFsJQjB_g_vBKftpm9"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/hospitals?select=id&limit=1"
