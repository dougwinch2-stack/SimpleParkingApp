<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <meta name="description" content="Find a hospital ward, see the best place to park and start navigation.">
  <title>Doug's Parking App</title>
  <meta name="dougs-admin" content="admin.html">
  <link rel="stylesheet" href="dougs.css">
  <script src="dougs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    /* Small text-style button for "Suggest a change" (colours from dougs.css) */
    /* Feedback bubble in the card's top-right corner – adds no height to the card */
    .card { position: relative; }
    .card__title { padding-right: 5.25rem; }
    .card__eyebrow { padding-right: 5.25rem; }
    .card__corner { position: absolute; top: var(--space-2); right: var(--space-2); display: flex; }
    .corner-btn {
      width: 44px; height: 44px; display: grid; place-items: center;
      background: none; border: 0; border-radius: 50%; color: var(--text-muted); cursor: pointer;
    }
    .corner-btn:hover { background: var(--surface-2); color: var(--brand-text); }
    .shared-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); }
    .toast {
      position: fixed; left: 50%; bottom: calc(var(--space-5, 1.5rem) + env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 50;
      background: var(--text); color: var(--bg); padding: var(--space-2) var(--space-4);
      border-radius: 999px; font-size: var(--text-sm); font-weight: 600; box-shadow: 0 4px 14px rgb(0 0 0 / .25);
    }
    .dialog form { display: grid; gap: var(--space-4); }
    .dialog h2 { margin: 0; }
    [hidden] { display: none !important; }

    /* Full-screen photo viewer: always dark, like a phone's own photo viewer */
    .photo-viewer {
      width: 100vw; height: 100dvh; max-width: none; max-height: none;
      margin: 0; padding: 0; border: 0; background: #000; color: #fff;
    }
    .photo-viewer[open] { display: flex; flex-direction: column; }
    .photo-viewer::backdrop { background: #000; }
    .pv-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(var(--space-2) + env(safe-area-inset-top)) var(--space-3) var(--space-2);
    }
    .pv-count { font-weight: 600; font-size: var(--text-sm); }
    /* The photo fills the space between the top bar and the caption, and never runs under the caption */
    .pv-stage { position: relative; flex: 1; min-height: 0; touch-action: pan-y pinch-zoom; }
    .pv-stage img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      user-select: none; -webkit-user-drag: none;
    }
    .pv-caption {
      margin: 0; padding: var(--space-3) var(--space-4) 0; background: #000;
      text-align: center; font-size: var(--text-md); font-weight: 600; line-height: 1.4;
    }
    .pv-caption:empty { display: none; }
    .pv-nav { display: flex; justify-content: space-between; gap: var(--space-3);
      padding: var(--space-3) var(--space-3) calc(var(--space-3) + env(safe-area-inset-bottom)); }
    .pv-btn {
      min-height: 48px; min-width: 48px; padding: 0 var(--space-4);
      background: rgb(255 255 255 / .16); color: #fff; border: 0; border-radius: 999px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .pv-btn:hover { background: rgb(255 255 255 / .26); }
    .pv-btn:disabled { visibility: hidden; }
    .pv-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__title" href="index.html">Doug's Parking App</a>
      <!-- <p class="app-header__subtitle">Find a ward, see the best place to park and start navigation.</p> -->
    </div>
  </header>

  <main class="container stack">

    <section class="field-row" aria-label="Ward filters">
      <div class="field">
        <label for="hospitalFilter">Hospital</label>
        <select id="hospitalFilter">
          <option value="">All hospitals</option>
        </select>
      </div>

      <div class="field">
        <label for="searchInput">Ward or department</label>
        <input id="searchInput" type="search"
               placeholder="Search ward, department or clinic…"
               autocomplete="off" enterkeyhint="search">
      </div>
    </section>

    <p id="summary" class="status-line" role="status">Loading…</p>

    <div id="sharedBar" class="shared-bar" hidden>
      <span class="status-line" style="margin: 0">Ward shared with you</span>
      <button id="showAllButton" class="btn btn--secondary" type="button">Show all wards</button>
    </div>

    <section id="results" class="stack" aria-live="polite">
      <div class="skeleton" style="height: 9rem"></div>
      <div class="skeleton" style="height: 9rem"></div>
    </section>

    <button id="missingButton" class="btn btn--ghost btn--block" type="button" hidden>
      Can't find a ward? Tell us
    </button>

  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <!-- ============ PHOTO VIEWER ============ -->
  <dialog id="photoViewer" class="photo-viewer" aria-label="Parking photos">
    <div class="pv-top">
      <span id="pvCount" class="pv-count"></span>
      <button id="pvClose" class="pv-btn" type="button" aria-label="Close photos">✕</button>
    </div>
    <div id="pvStage" class="pv-stage"><img id="pvImg" alt=""></div>
    <p id="pvCaption" class="pv-caption"></p>
    <div class="pv-nav">
      <button id="pvPrev" class="pv-btn" type="button">‹ Previous</button>
      <button id="pvNext" class="pv-btn" type="button">Next ›</button>
    </div>
  </dialog>

  <!-- ============ SUGGESTION FORM ============ -->
  <dialog id="suggestDialog" class="dialog" aria-labelledby="suggestTitle">
    <form id="suggestForm" method="dialog" novalidate>
      <h2 id="suggestTitle">Suggest a change</h2>
      <p id="suggestAbout" class="status-line" style="margin: 0"></p>

      <div class="field" id="kindField">
        <label for="suggestKind">What needs changing?</label>
        <select id="suggestKind">
          <option value="Wrong details">Wrong or out-of-date details</option>
          <option value="Better parking spot">Better place to park</option>
          <option value="Ward closed or moved">Ward closed or moved</option>
          <option value="Other">Something else</option>
        </select>
      </div>

      <div class="field" id="hospitalField" hidden>
        <label for="suggestHospital">Hospital</label>
        <select id="suggestHospital"></select>
      </div>

      <div class="field" id="wardNameField" hidden>
        <label for="suggestWardName">Ward or department name</label>
        <input id="suggestWardName" autocomplete="off">
      </div>

      <div class="field">
        <label for="suggestMessage" id="suggestMessageLabel">Details</label>
        <textarea id="suggestMessage" maxlength="1900"></textarea>
      </div>

      <div class="field">
        <button id="suggestLocate" class="btn btn--secondary" type="button">Add my current location</button>
        <div id="suggestLocationNote" class="field__hint">Handy if you're standing at the best place to park.</div>
      </div>

      <div id="suggestError" class="field__error" role="alert"></div>
      <p class="field__hint" style="margin: 0">Anonymous – only Doug sees this. Sign your name in the details if you'd like a thank you.</p>

      <div class="row">
        <button id="suggestSend" class="btn btn--go" type="submit" value="send">Send</button>
        <button class="btn btn--ghost" type="button" data-close>Cancel</button>
      </div>
    </form>

    <div id="suggestThanks" class="stack" hidden>
      <h2>Thanks!</h2>
      <p>Doug will check it and update the app.</p>
      <button class="btn btn--primary" type="button" data-close>Close</button>
    </div>
  </dialog>

  <script>
    /* =================================================================
       SUPABASE CONNECTION
       Paste your project's details here (Supabase → Project Settings → API).
       The key is the "anon" / "publishable" key – it is meant to be public;
       the database's security rules decide what it can do.
       ================================================================= */
    const SUPABASE_URL = "https://vruayefwgzwlwestsedo.supabase.co";       // e.g. https://abcdefgh.supabase.co
    const SUPABASE_KEY = "sb_publishable_AWpInxkGOBc1bWFsJQjB_g_vBKftpm9";

    /*
      Data comes from the database view "ward_cards" (one row per ward).
      In notes and driver notes, "|" starts a new line.
      Driver notes starting with **WARNING** are shown as a highlighted warning.
    */

    const hospitalFilter = document.getElementById("hospitalFilter");
    const searchInput = document.getElementById("searchInput");
    const resultsElement = document.getElementById("results");
    const summaryElement = document.getElementById("summary");

    let db = null;
    let wardsData = [];
    let wardsById = new Map();

    /* ---------- Small helpers ---------- */

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalise(value) {
      return String(value == null ? "" : value).trim();
    }

    /* Make UK phone numbers tappable (e.g. "0300 443 4916"). Runs on escaped text. */
    function linkPhoneNumbers(escapedText) {
      return escapedText.replace(/\b0\d{2,4}(?:\s?\d{3,4}){2}\b/g, number =>
        `<a href="tel:${number.replace(/\s/g, "")}" data-track="call">${number}</a>`);
    }

    /* Notes: "|" becomes a new line; phone numbers become links */
    function formatNotes(value) {
      return normalise(value)
        .split("|")
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => linkPhoneNumbers(escapeHtml(line)))
        .join("<br>");
    }

    function mapUrl(c) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${c.latitude},${c.longitude}`)}`;
    }

    function navigationUrl(c) {
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${c.latitude},${c.longitude}`)}&travelmode=driving`;
    }

    /* ---------- Anonymous usage log ----------
       No personal data and no locations. Each row has: a random code kept on
       this device, a random code for this visit, what was searched or tapped,
       phone/tablet/computer, home-screen icon or browser, light/dark, and
       seconds since the app was opened. */

    function randomId() {
      return crypto.randomUUID ? crypto.randomUUID()
        : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
            (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
    }

    const DEVICE_ID = (() => {
      const key = "dougs.device";
      try {
        let id = localStorage.getItem(key);
        if (!id) {
          id = randomId();
          localStorage.setItem(key, id);
        }
        return id;
      } catch (e) {
        return null;
      }
    })();

    const DEVICE_TYPE = (() => {
      const touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
      if (!touch) return "computer";
      return Math.min(screen.width, screen.height) < 600 ? "phone" : "tablet";
    })();

    const LAUNCHED_FROM =
      (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone
        ? "home screen" : "browser";

    function themeNow() {
      const chosen = document.documentElement.getAttribute("data-theme");
      if (chosen === "light" || chosen === "dark") return chosen;
      return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    /* A "visit" starts when the app opens, or when it's come back to after 30+ minutes away */
    let visitId = randomId();
    let visitStart = Date.now();
    let hiddenAt = null;

    let lastSearch = "";
    let lastLoggedSearch = "";
    let searchTimer = null;

    function logUsage(event) {
      if (!db) return;
      db.from("usage_events")
        .insert({
          device_id: DEVICE_ID,
          visit_id: visitId,
          device_type: DEVICE_TYPE,
          launched_from: LAUNCHED_FROM,
          theme: themeNow(),
          seconds_in: Math.min(86400, Math.round((Date.now() - visitStart) / 1000)),
          ...event
        })
        .then(() => {}, () => {});      // never let logging affect the app
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 30 * 60 * 1000 && wardsData.length) {
        visitId = randomId();
        visitStart = Date.now();
        lastLoggedSearch = "";
        logUsage({ kind: "open" });
      }
      hiddenAt = null;
    });

    function selectedHospitalId() {
      return hospitalFilter.value ? Number(hospitalFilter.value) : null;
    }

    /* Log a search once typing has paused for 2 seconds (not every letter) */
    function scheduleSearchLog(resultCount) {
      clearTimeout(searchTimer);
      const text = searchInput.value.trim().toLowerCase().slice(0, 60);
      lastSearch = text;
      if (text.length < 3) return;
      searchTimer = setTimeout(() => {
        if (text === lastLoggedSearch) return;
        lastLoggedSearch = text;
        logUsage({ kind: "search", search_text: text, result_count: resultCount, hospital_id: selectedHospitalId() });
      }, 2000);
    }

    /* Log taps on Map / Navigate / diagram / phone links */
    resultsElement.addEventListener("click", event => {
      const link = event.target.closest("[data-track]");
      if (!link) return;
      const card = link.closest("[data-ward]");
      const ward = card ? wardsById.get(Number(card.dataset.ward)) : null;
      logUsage({
        kind: link.dataset.track,
        ward_id: ward ? ward.id : null,
        hospital_id: ward ? ward.hospitalId : selectedHospitalId(),
        search_text: lastSearch.length >= 3 ? lastSearch : null
      });
    });

    /* ---------- Rendering ---------- */

    const WARNING = /^\*\*\s*WARNING\s*\*\*\s*/i;

    function driverNotesHtml(notes) {
      if (!notes) return "";
      if (WARNING.test(notes)) {
        return `<div class="alert alert--warn"><strong>Warning</strong>${formatNotes(notes.replace(WARNING, ""))}</div>`;
      }
      return `<div><dt>Driver notes:</dt> <dd>${formatNotes(notes)}</dd></div>`;
    }

    /* Speech bubble: "feedback / tell us" */
    const FEEDBACK_ICON =
      '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/><path d="M12 8v4"/><path d="M12 15.5h.01"/></svg>';

    /* Share: three joined dots (the usual "share" symbol) */
    const SHARE_ICON =
      '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>' +
      '<path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';

    /* Camera: "photos of the parking spot" */
    const CAMERA_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>';

    /* Small floor-plan icon shown on diagram buttons */
    const FLOORPLAN_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h7v9"/><path d="M14 3v6h7"/><path d="M14 13v8"/></svg>';

    /* Map pin: "this place on a map" */
    const PIN_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

    /* Navigation arrow: "take me there" */
    const NAV_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">' +
      '<path d="M21 3 3 10.5l7.5 3L14 21 21 3z" fill="currentColor"/></svg>';

    /* "Ground Floor Diagram" -> "Ground Floor": the icon already says it's a diagram */
    function diagramLabel(name) {
      return normalise(name).replace(/\s*diagram$/i, "") || name;
    }

    function diagramButtons(diagrams) {
      if (!diagrams || diagrams.length === 0) {
        return `<span class="btn" aria-disabled="true">${FLOORPLAN_ICON}No diagram</span>`;
      }
      return diagrams.map(diagram => `
        <a class="btn btn--ghost" href="${escapeHtml(diagram.file)}" target="_blank" rel="noopener" data-track="diagram"
           aria-label="${escapeHtml(diagramLabel(diagram.name))} diagram">${FLOORPLAN_ICON}${escapeHtml(diagramLabel(diagram.name))}</a>
      `).join("");
    }

    function photoButton(item) {
      const n = item.photos.length;
      if (!n || !item.coordinates) return "";
      return `<button type="button" class="btn btn--ghost" data-photos="${item.id}">${CAMERA_ICON}Photos (${n})</button>`;
    }

    function cardHtml(item) {
      const hasParking = item.coordinates !== null;
      const isWarning = hasParking && WARNING.test(item.driverNotes);

      const details = [
        item.floor ? `<div><dt>Floor:</dt> <dd>${escapeHtml(item.floor)}</dd></div>` : "",
        item.parkingLocation ? `<div><dt>Park at:</dt> <dd>${escapeHtml(item.parkingLocation)}</dd></div>` : "",
        item.preferredApproach ? `<div><dt>Approach:</dt> <dd>${escapeHtml(item.preferredApproach)}</dd></div>` : "",
        hasParking && !isWarning ? driverNotesHtml(item.driverNotes) : "",
        item.notes ? `<div><dt>Notes:</dt> <dd>${formatNotes(item.notes)}</dd></div>` : ""
      ].join("");

      const parkingActions = hasParking
        ? `<a class="btn btn--secondary" href="${escapeHtml(mapUrl(item.coordinates))}" target="_blank" rel="noopener" data-track="map">${PIN_ICON}Map</a>
           <a class="btn btn--go" href="${escapeHtml(navigationUrl(item.coordinates))}" target="_blank" rel="noopener" data-track="navigate">${NAV_ICON}Navigate</a>`
        : "";

      return `
        <article class="card ${hasParking ? (isWarning ? "card--warn" : "") : "card--plain"}" data-ward="${item.id}">
          <div class="card__corner">
            <button type="button" class="corner-btn" data-share="${item.id}" aria-label="Share a link to ${escapeHtml(item.ward)}" title="Share">${SHARE_ICON}</button>
            <button type="button" class="corner-btn suggest-link" data-suggest="${item.id}" aria-label="Suggest a change to ${escapeHtml(item.ward)}" title="Suggest a change">${FEEDBACK_ICON}</button>
          </div>
          <div class="card__eyebrow">${escapeHtml(item.hospital)}</div>
          <h2 class="card__title">${escapeHtml(item.ward)}</h2>
          <dl class="card__body">${details}</dl>
          ${isWarning ? `<div style="margin-bottom: var(--space-3)">${driverNotesHtml(item.driverNotes)}</div>` : ""}
          ${hasParking ? "" : '<p class="text-warn small"><strong>Parking location not yet available</strong></p>'}
          ${parkingActions ? `<div class="card__actions" style="margin-bottom: var(--space-2)">${parkingActions}</div>` : ""}
          <div class="card__actions">${photoButton(item)}${diagramButtons(item.diagrams)}</div>
        </article>`;
    }

    /* ---------- Shared ward links: index.html?ward=123 ---------- */

    let sharedWardId = Number(new URLSearchParams(location.search).get("ward")) || null;

    function wardLink(id) {
      return `${location.origin}${location.pathname}?ward=${id}`;
    }

    function leaveSharedWard() {
      if (!sharedWardId) return;
      sharedWardId = null;
      document.getElementById("sharedBar").hidden = true;
      history.replaceState(null, "", location.pathname);
    }

    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2500);
    }

    async function shareWard(item) {
      const url = wardLink(item.id);
      logUsage({ kind: "share", ward_id: item.id, hospital_id: item.hospitalId });
      if (navigator.share) {
        try {
          await navigator.share({ title: `${item.ward} – ${item.hospital}`, text: `${item.ward} – ${item.hospital}: parking and directions`, url });
        } catch (e) { /* closed the share menu – nothing to do */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast("Link copied – paste it into a message");
      } catch (e) {
        window.prompt("Copy this link:", url);
      }
    }

    function renderResults() {
      if (sharedWardId) {
        const item = wardsById.get(sharedWardId);
        if (item) {
          summaryElement.hidden = true;
          document.getElementById("sharedBar").hidden = false;
          resultsElement.innerHTML = cardHtml(item);
          return 1;
        }
        leaveSharedWard();
        showToast("That shared ward is no longer listed");
      }

      summaryElement.hidden = false;
      const selectedHospital = hospitalFilter.value;
      const search = searchInput.value.trim().toLowerCase();

      const matches = wardsData
        .filter(item => !selectedHospital || String(item.hospitalId) === selectedHospital)
        .filter(item => !search ||
          [item.ward, item.floor, item.notes].join(" ").toLowerCase().includes(search))
        .sort((a, b) => a.hospital.localeCompare(b.hospital) || a.ward.localeCompare(b.ward));

      summaryElement.textContent = `${matches.length} ${matches.length === 1 ? "result" : "results"}`;

      resultsElement.innerHTML = matches.length
        ? matches.map(cardHtml).join("")
        : '<div class="empty">No wards match your search.</div>';

      return matches.length;
    }

    function populateHospitals() {
      const hospitals = new Map();
      wardsData.forEach(item => hospitals.set(item.hospitalId, item.hospital));

      hospitalFilter.innerHTML = '<option value="">All hospitals</option>';
      [...hospitals.entries()]
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([id, name]) => {
          const option = document.createElement("option");
          option.value = String(id);
          option.textContent = name;
          hospitalFilter.appendChild(option);
        });
    }

    /* ---------- Start ---------- */

    function showError(message) {
      summaryElement.textContent = "Data failed to load";
      summaryElement.classList.add("status-line--error");
      resultsElement.innerHTML = `
        <div class="alert alert--danger">
          <strong>The ward and parking data could not be loaded.</strong>
          ${escapeHtml(message)}
        </div>`;
    }

    async function startApp() {
      if (SUPABASE_URL.startsWith("PASTE") || SUPABASE_KEY.startsWith("PASTE")) {
        showError("The Supabase project details haven't been added to index.html yet.");
        return;
      }
      if (!window.supabase) {
        showError("Couldn't load the database library. Check the internet connection and refresh.");
        return;
      }

      try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: false }
        });

        const { data, error } = await db.from("ward_cards").select("*");
        if (error) throw error;

        wardsData = data.map(row => ({
          id: row.id,
          hospitalId: row.hospital_id,
          hospital: normalise(row.hospital),
          ward: normalise(row.ward),
          floor: normalise(row.floor),
          notes: normalise(row.notes),
          parkingLocation: normalise(row.parking_location),
          preferredApproach: normalise(row.preferred_approach),
          driverNotes: normalise(row.driver_notes),
          coordinates: row.latitude != null && row.longitude != null
            ? { latitude: Number(row.latitude), longitude: Number(row.longitude) }
            : null,
          diagrams: Array.isArray(row.diagrams) ? row.diagrams : [],
          photos: Array.isArray(row.photos) ? row.photos : []
        }));
        wardsById = new Map(wardsData.map(item => [item.id, item]));

        populateHospitals();

        hospitalFilter.addEventListener("change", () => { leaveSharedWard(); scheduleSearchLog(renderResults()); });
        searchInput.addEventListener("input", () => { leaveSharedWard(); scheduleSearchLog(renderResults()); });

        renderResults();
        document.getElementById("missingButton").hidden = false;
        logUsage({ kind: "open" });
        if (sharedWardId && wardsById.has(sharedWardId)) {
          const shared = wardsById.get(sharedWardId);
          logUsage({ kind: "shared_open", ward_id: shared.id, hospital_id: shared.hospitalId });
        }
      } catch (error) {
        console.error(error);
        showError("The database may be waking up or unreachable. Wait a moment and refresh. " +
                  (error && error.message ? `(${error.message})` : ""));
      }
    }

    /* ---------- Suggestions (anonymous; only Doug can read them) ---------- */

    const dialog = document.getElementById("suggestDialog");
    const suggestForm = document.getElementById("suggestForm");
    let suggestWard = null;          // the ward being commented on, or null for "missing ward"
    let suggestCoords = null;

    function openSuggest(ward) {
      suggestWard = ward;
      suggestCoords = null;
      logUsage({ kind: "feedback", ward_id: ward ? ward.id : null, hospital_id: ward ? ward.hospitalId : selectedHospitalId() });
      suggestForm.reset();
      suggestForm.hidden = false;
      document.getElementById("suggestThanks").hidden = true;
      document.getElementById("suggestError").textContent = "";
      document.getElementById("suggestLocate").textContent = "Add my current location";
      document.getElementById("suggestLocationNote").textContent = "Handy if you're standing at the best place to park.";

      const missing = !ward;
      document.getElementById("suggestTitle").textContent = missing ? "Tell us about a missing ward" : "Suggest a change";
      document.getElementById("suggestAbout").textContent = missing ? "" : `${ward.ward} – ${ward.hospital}`;
      document.getElementById("suggestAbout").hidden = missing;
      document.getElementById("kindField").hidden = missing;
      document.getElementById("hospitalField").hidden = !missing;
      document.getElementById("wardNameField").hidden = !missing;
      document.getElementById("suggestMessageLabel").textContent =
        missing ? "Where is it, and where's best to park?" : "Details";

      if (missing) {
        const select = document.getElementById("suggestHospital");
        select.innerHTML = [...hospitalFilter.options]
          .map(o => `<option value="${o.value}">${o.value ? escapeHtml(o.textContent) : "Not sure / other"}</option>`).join("");
        select.value = hospitalFilter.value;
      }

      if (dialog.showModal) dialog.showModal(); else dialog.setAttribute("open", "");
    }

    function closeSuggest() {
      if (dialog.close) dialog.close(); else dialog.removeAttribute("open");
    }

    resultsElement.addEventListener("click", event => {
      const link = event.target.closest("[data-suggest]");
      if (link) openSuggest(wardsById.get(Number(link.dataset.suggest)));
    });

    document.getElementById("missingButton").addEventListener("click", () => openSuggest(null));
    /* ---------- Photo viewer ---------- */

    const viewer = document.getElementById("photoViewer");
    const pvImg = document.getElementById("pvImg");
    let viewerPhotos = [], viewerIndex = 0, viewerTitle = "";

    const photoUrl = path => `${SUPABASE_URL}/storage/v1/object/public/parking-photos/${path.split("/").map(encodeURIComponent).join("/")}`;

    function showPhoto(i) {
      viewerIndex = Math.max(0, Math.min(i, viewerPhotos.length - 1));
      const photo = viewerPhotos[viewerIndex];
      pvImg.src = photoUrl(photo.path);
      pvImg.alt = photo.caption || `Photo ${viewerIndex + 1} of ${viewerTitle}`;
      document.getElementById("pvCaption").textContent = photo.caption || "";
      document.getElementById("pvCount").textContent =
        viewerPhotos.length > 1 ? `${viewerIndex + 1} of ${viewerPhotos.length}` : viewerTitle;
      document.getElementById("pvPrev").disabled = viewerIndex === 0;
      document.getElementById("pvNext").disabled = viewerIndex === viewerPhotos.length - 1;
      const next = viewerPhotos[viewerIndex + 1];
      if (next) new Image().src = photoUrl(next.path);      // load the next one early
    }

    function openPhotos(item) {
      viewerPhotos = item.photos;
      viewerTitle = item.parkingLocation || item.ward;
      showPhoto(0);
      logUsage({ kind: "photo", ward_id: item.id, hospital_id: item.hospitalId });
      history.pushState({ photoViewer: true }, "");          // so the phone's Back button closes it
      if (viewer.showModal) viewer.showModal(); else viewer.setAttribute("open", "");
    }

    function closePhotos() {
      if (history.state && history.state.photoViewer) history.back();   // popstate closes it
      else if (viewer.open) viewer.close();
    }

    window.addEventListener("popstate", () => { if (viewer.open) viewer.close(); });
    viewer.addEventListener("cancel", event => { event.preventDefault(); closePhotos(); });
    document.getElementById("pvClose").addEventListener("click", closePhotos);
    document.getElementById("pvPrev").addEventListener("click", () => showPhoto(viewerIndex - 1));
    document.getElementById("pvNext").addEventListener("click", () => showPhoto(viewerIndex + 1));
    viewer.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") showPhoto(viewerIndex - 1);
      if (event.key === "ArrowRight") showPhoto(viewerIndex + 1);
    });

    // Swipe left / right (ignored while zoomed in)
    let swipeX = null;
    const stage = document.getElementById("pvStage");
    stage.addEventListener("pointerdown", event => { swipeX = event.clientX; });
    stage.addEventListener("pointerup", event => {
      if (swipeX === null) return;
      const dx = event.clientX - swipeX;
      swipeX = null;
      if (window.visualViewport && window.visualViewport.scale > 1.05) return;
      if (Math.abs(dx) > 50) showPhoto(viewerIndex + (dx < 0 ? 1 : -1));
    });
    stage.addEventListener("pointercancel", () => { swipeX = null; });

    resultsElement.addEventListener("click", event => {
      const button = event.target.closest("[data-photos]");
      if (button) openPhotos(wardsById.get(Number(button.dataset.photos)));
    });

    document.getElementById("showAllButton").addEventListener("click", () => {
      leaveSharedWard();
      renderResults();
      searchInput.focus();
    });
    resultsElement.addEventListener("click", event => {
      const button = event.target.closest("[data-share]");
      if (button) shareWard(wardsById.get(Number(button.dataset.share)));
    });
    suggestForm.addEventListener("input", () => { document.getElementById("suggestError").textContent = ""; });
    dialog.addEventListener("click", event => {
      if (event.target.closest("[data-close]")) closeSuggest();
    });

    document.getElementById("suggestLocate").addEventListener("click", event => {
      const button = event.currentTarget;
      const note = document.getElementById("suggestLocationNote");
      if (!navigator.geolocation) { note.textContent = "Location isn't available on this phone."; return; }
      button.textContent = "Finding you…";
      navigator.geolocation.getCurrentPosition(
        pos => {
          suggestCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          button.textContent = "Location added ✓";
          note.textContent = "Your current position will be sent with this suggestion.";
        },
        () => {
          button.textContent = "Add my current location";
          note.textContent = "Couldn't get your location – check location is allowed for this site.";
        },
        { enableHighAccuracy: true, timeout: 15000 });
    });

    suggestForm.addEventListener("submit", async event => {
      event.preventDefault();
      const error = document.getElementById("suggestError");
      const send = document.getElementById("suggestSend");
      const details = document.getElementById("suggestMessage").value.trim();
      const missing = !suggestWard;
      const wardName = document.getElementById("suggestWardName").value.trim();

      error.textContent = "";
      if (missing && !wardName) { error.textContent = "Please add the ward or department name."; return; }
      if (!missing && details.length < 3) { error.textContent = "Please add a few words about what's wrong."; return; }
      if (!db) { error.textContent = "Not connected – please try again in a moment."; return; }

      const hospitalId = missing
        ? (Number(document.getElementById("suggestHospital").value) || null)
        : suggestWard.hospitalId;

      const row = {
        kind: missing ? "Missing ward" : document.getElementById("suggestKind").value,
        hospital_id: hospitalId,
        ward_id: missing ? null : suggestWard.id,
        message: missing ? `Ward: ${wardName}${details ? "\n" + details : ""}` : details,
        suggested_latitude: suggestCoords ? Number(suggestCoords.lat.toFixed(6)) : null,
        suggested_longitude: suggestCoords ? Number(suggestCoords.lng.toFixed(6)) : null,
        device_id: DEVICE_ID
      };

      send.disabled = true; send.textContent = "Sending…";
      const { error: dbError } = await db.from("suggestions").insert(row);
      send.disabled = false; send.textContent = "Send";

      if (dbError) {
        error.textContent = /too many/i.test(dbError.message || "")
          ? "You've sent a lot of suggestions recently – please try again later."
          : "Sorry, that didn't send. Please try again.";
        return;
      }
      suggestForm.hidden = true;
      document.getElementById("suggestThanks").hidden = false;
    });

    startApp();
  </script>
</body>
</html>
