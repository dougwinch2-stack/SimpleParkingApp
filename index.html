<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <meta name="description" content="Find a hospital ward, see the best place to park and start navigation.">
  <title>Doug's Parking App</title>
  <link rel="stylesheet" href="dougs.css">
  <script src="dougs.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__title" href="index.html">Doug's Parking App</a>
      <!-- <p class="app-header__subtitle">Find a ward, see the best place to park and start navigation.</p> -->
    </div>
  </header>

  <main class="container stack">

    <section class="field-row" aria-label="Ward filters">
      <div class="field">
        <label for="hospitalFilter">Hospital</label>
        <select id="hospitalFilter">
          <option value="">All hospitals</option>
        </select>
      </div>

      <div class="field">
        <label for="searchInput">Ward or department</label>
        <input id="searchInput" type="search"
               placeholder="Search ward, department or clinic…"
               autocomplete="off" enterkeyhint="search">
      </div>
    </section>

    <p id="summary" class="status-line" role="status">Loading…</p>

    <section id="results" class="stack" aria-live="polite">
      <div class="skeleton" style="height: 9rem"></div>
      <div class="skeleton" style="height: 9rem"></div>
    </section>

  </main>

  <script>
    /*
      Data lives in three CSV files next to this page:
        dataWards.csv              Hospital, Ward, Floor, ParkingLocation, Notes
        dataParkingLocations.csv   Hospital, ParkingLocation, Coordinates, DriverNotes
        dataHospitalDiagrams.csv   Hospital, DiagramName, File
      In Notes and DriverNotes, "|" starts a new line.
      DriverNotes starting with **WARNING** are shown as a highlighted warning.
    */
    const DATA_FILES = {
      wards: "dataWards.csv",
      parking: "dataParkingLocations.csv",
      diagrams: "dataHospitalDiagrams.csv"
    };

    const hospitalFilter = document.getElementById("hospitalFilter");
    const searchInput = document.getElementById("searchInput");
    const resultsElement = document.getElementById("results");
    const summaryElement = document.getElementById("summary");

    let wardsData = [];
    let parkingLookup = new Map();
    let diagramsLookup = new Map();

    /* ---------- Small helpers ---------- */

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalise(value) {
      return String(value == null ? "" : value).trim();
    }

    function lookupKey(hospital, parkingLocation) {
      return `${normalise(hospital)}\u0000${normalise(parkingLocation)}`;
    }

    /* Make UK phone numbers tappable (e.g. "0300 443 4916"). Runs on escaped text. */
    function linkPhoneNumbers(escapedText) {
      return escapedText.replace(/\b0\d{2,4}(?:\s?\d{3,4}){2}\b/g, number =>
        `<a href="tel:${number.replace(/\s/g, "")}">${number}</a>`);
    }

    /* Notes: "|" becomes a new line; phone numbers become links */
    function formatNotes(value) {
      return normalise(value)
        .split("|")
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => linkPhoneNumbers(escapeHtml(line)))
        .join("<br>");
    }

    /* ---------- CSV loading ---------- */

    /*
      Small CSV parser supporting quoted fields, commas inside quotes,
      doubled quotation marks, and Windows or Unix line endings.
    */
    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      text = text.replace(/^﻿/, "");

      for (let i = 0; i < text.length; i += 1) {
        const character = text[i];

        if (inQuotes) {
          if (character === '"') {
            if (text[i + 1] === '"') { field += '"'; i += 1; }
            else { inQuotes = false; }
          } else {
            field += character;
          }
          continue;
        }

        if (character === '"') inQuotes = true;
        else if (character === ",") { row.push(field); field = ""; }
        else if (character === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (character !== "\r") field += character;
      }

      if (field !== "" || row.length > 0) { row.push(field); rows.push(row); }

      while (rows.length > 0 && rows[rows.length - 1].every(v => v.trim() === "")) rows.pop();
      if (rows.length === 0) return [];

      const headers = rows[0].map(header => header.trim());

      return rows.slice(1)
        .filter(values => values.some(value => value.trim() !== ""))
        .map(values => {
          const record = {};
          headers.forEach((header, index) => {
            record[header] = values[index] == null ? "" : values[index].trim();
          });
          return record;
        });
    }

    async function fetchCsv(filename) {
      const response = await fetch(filename, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Could not load ${filename}: ${response.status} ${response.statusText}`);
      }
      return { filename, records: parseCsv(await response.text()) };
    }

    function requireHeaders(records, requiredHeaders, filename) {
      if (records.length === 0) throw new Error(`${filename} contains no data rows.`);
      const available = Object.keys(records[0]);
      const missing = requiredHeaders.filter(header => !available.includes(header));
      if (missing.length > 0) throw new Error(`${filename} is missing ${missing.join(", ")}.`);
    }

    function parseCoordinates(value) {
      const parts = normalise(value).split(",").map(part => part.trim());
      if (parts.length !== 2) return null;
      const latitude = Number(parts[0]);
      const longitude = Number(parts[1]);
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
      return { latitude, longitude };
    }

    function mapUrl(c) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${c.latitude},${c.longitude}`)}`;
    }

    function navigationUrl(c) {
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${c.latitude},${c.longitude}`)}&travelmode=driving`;
    }

    /* ---------- Rendering ---------- */

    function driverNotesHtml(notes) {
      if (!notes) return "";
      const warning = /^\*\*\s*WARNING\s*\*\*\s*/i;
      if (warning.test(notes)) {
        return `<div class="alert alert--warn"><strong>Warning</strong>${formatNotes(notes.replace(warning, ""))}</div>`;
      }
      return `<div><dt>Driver notes:</dt> <dd>${formatNotes(notes)}</dd></div>`;
    }

    /* Small floor-plan icon shown on diagram buttons */
    const FLOORPLAN_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h7v9"/><path d="M14 3v6h7"/><path d="M14 13v8"/></svg>';

    /* Map pin: "this place on a map" */
    const PIN_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

    /* Navigation arrow: "take me there" (same idea as Google/Apple Maps) */
    const NAV_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">' +
      '<path d="M21 3 3 10.5l7.5 3L14 21 21 3z" fill="currentColor"/></svg>';

    /* "Ground Floor Diagram" -> "Ground Floor": the icon already says it's a diagram */
    function diagramLabel(name) {
      return normalise(name).replace(/\s*diagram$/i, "") || name;
    }

    function diagramButtons(hospital) {
      const diagrams = diagramsLookup.get(hospital) || [];
      if (diagrams.length === 0) {
        return `<span class="btn" aria-disabled="true">${FLOORPLAN_ICON}No diagram</span>`;
      }
      return diagrams.map(diagram => `
        <a class="btn btn--ghost" href="${escapeHtml(diagram.file)}" target="_blank" rel="noopener"
           aria-label="${escapeHtml(diagramLabel(diagram.name))} diagram">${FLOORPLAN_ICON}${escapeHtml(diagramLabel(diagram.name))}</a>
      `).join("");
    }

    function cardHtml(item) {
      const location = parkingLookup.get(lookupKey(item.hospital, item.parkingLocation));
      const hasParking =
        location && location.coordinates && item.parkingLocation.toUpperCase() !== "TBC";
      const showParkName =
        item.parkingLocation && item.parkingLocation.toUpperCase() !== "TBC";

      const details = [
        item.floor ? `<div><dt>Floor:</dt> <dd>${escapeHtml(item.floor)}</dd></div>` : "",
        showParkName ? `<div><dt>Park at:</dt> <dd>${escapeHtml(item.parkingLocation)}</dd></div>` : "",
        hasParking && !/^\*\*\s*WARNING/i.test(location.driverNotes) ? driverNotesHtml(location.driverNotes) : "",
        item.notes ? `<div><dt>Notes:</dt> <dd>${formatNotes(item.notes)}</dd></div>` : ""
      ].join("");

      const warning =
        hasParking && /^\*\*\s*WARNING/i.test(location.driverNotes) ? driverNotesHtml(location.driverNotes) : "";

      const parkingActions = hasParking
        ? `<a class="btn btn--secondary" href="${escapeHtml(mapUrl(location.coordinates))}" target="_blank" rel="noopener">${PIN_ICON}Map</a>
           <a class="btn btn--go" href="${escapeHtml(navigationUrl(location.coordinates))}" target="_blank" rel="noopener">${NAV_ICON}Navigate</a>`
        : "";

      return `
        <article class="card ${hasParking ? (warning ? "card--warn" : "") : "card--plain"}">
          <div class="card__eyebrow">${escapeHtml(item.hospital)}</div>
          <h2 class="card__title">${escapeHtml(item.ward)}</h2>
          <dl class="card__body">${details}</dl>
          ${warning ? `<div style="margin-bottom: var(--space-3)">${warning}</div>` : ""}
          ${hasParking ? "" : '<p class="text-warn small"><strong>Parking location not yet available</strong></p>'}
          ${parkingActions ? `<div class="card__actions" style="margin-bottom: var(--space-2)">${parkingActions}</div>` : ""}
          <div class="card__actions">${diagramButtons(item.hospital)}</div>
        </article>`;
    }

    function renderResults() {
      const selectedHospital = hospitalFilter.value;
      const search = searchInput.value.trim().toLowerCase();

      const matches = wardsData
        .filter(item => !selectedHospital || item.hospital === selectedHospital)
        .filter(item => !search ||
          [item.ward, item.floor, item.notes].join(" ").toLowerCase().includes(search))
        .sort((a, b) => a.hospital.localeCompare(b.hospital) || a.ward.localeCompare(b.ward));

      summaryElement.textContent = `${matches.length} ${matches.length === 1 ? "result" : "results"}`;

      resultsElement.innerHTML = matches.length
        ? matches.map(cardHtml).join("")
        : '<div class="empty">No wards match your search.</div>';
    }

    function populateHospitals() {
      hospitalFilter.innerHTML = '<option value="">All hospitals</option>';
      [...new Set(wardsData.map(item => item.hospital).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b))
        .forEach(hospital => {
          const option = document.createElement("option");
          option.value = hospital;
          option.textContent = hospital;
          hospitalFilter.appendChild(option);
        });
    }

    function buildLookups(parkingRecords, diagramRecords) {
      parkingLookup = new Map();
      diagramsLookup = new Map();

      parkingRecords.forEach(record => {
        const hospital = normalise(record.Hospital);
        const parkingLocation = normalise(record.ParkingLocation);
        if (!hospital || !parkingLocation) return;
        parkingLookup.set(lookupKey(hospital, parkingLocation), {
          coordinates: parseCoordinates(record.Coordinates),
          driverNotes: normalise(record.DriverNotes)
        });
      });

      diagramRecords.forEach(record => {
        const hospital = normalise(record.Hospital);
        const name = normalise(record.DiagramName);
        const file = normalise(record.File);
        if (!hospital || !name || !file) return;
        if (!diagramsLookup.has(hospital)) diagramsLookup.set(hospital, []);
        diagramsLookup.get(hospital).push({ name, file });
      });
    }

    /* ---------- Start ---------- */

    async function startApp() {
      try {
        const [wardsResult, parkingResult, diagramsResult] = await Promise.all([
          fetchCsv(DATA_FILES.wards),
          fetchCsv(DATA_FILES.parking),
          fetchCsv(DATA_FILES.diagrams)
        ]);

        requireHeaders(wardsResult.records, ["Hospital", "Ward", "Floor", "ParkingLocation", "Notes"], wardsResult.filename);
        requireHeaders(parkingResult.records, ["Hospital", "ParkingLocation", "Coordinates", "DriverNotes"], parkingResult.filename);
        requireHeaders(diagramsResult.records, ["Hospital", "DiagramName", "File"], diagramsResult.filename);

        wardsData = wardsResult.records.map(record => ({
          hospital: normalise(record.Hospital),
          ward: normalise(record.Ward),
          floor: normalise(record.Floor),
          parkingLocation: normalise(record.ParkingLocation),
          notes: normalise(record.Notes)
        })).filter(item => item.hospital && item.ward);

        buildLookups(parkingResult.records, diagramsResult.records);
        populateHospitals();

        hospitalFilter.addEventListener("change", renderResults);
        searchInput.addEventListener("input", renderResults);

        renderResults();
      } catch (error) {
        console.error(error);
        summaryElement.textContent = "Data failed to load";
        summaryElement.classList.add("status-line--error");
        resultsElement.innerHTML = `
          <div class="alert alert--danger">
            <strong>The ward and parking data could not be loaded.</strong>
            ${escapeHtml(error.message)}<br>
            Check that index.html and the three CSV files are in the same GitHub folder,
            with exactly the same capital letters in their names.
          </div>`;
      }
    }

    startApp();
  </script>
</body>
</html>
