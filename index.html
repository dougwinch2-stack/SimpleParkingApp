<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f6c">
  <meta name="description" content="Find a hospital ward, see the best place to park and start navigation.">
  <title>Doug's Parking App</title>
  <meta name="dougs-admin" content="admin.html">
  <link rel="stylesheet" href="dougs.css">
  <script src="dougs.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__title" href="index.html">Doug's Parking App</a>
      <!-- <p class="app-header__subtitle">Find a ward, see the best place to park and start navigation.</p> -->
    </div>
  </header>

  <main class="container stack">

    <section class="field-row" aria-label="Ward filters">
      <div class="field">
        <label for="hospitalFilter">Hospital</label>
        <select id="hospitalFilter">
          <option value="">All hospitals</option>
        </select>
      </div>

      <div class="field">
        <label for="searchInput">Ward or department</label>
        <input id="searchInput" type="search"
               placeholder="Search ward, department or clinic…"
               autocomplete="off" enterkeyhint="search">
      </div>
    </section>

    <p id="summary" class="status-line" role="status">Loading…</p>

    <section id="results" class="stack" aria-live="polite">
      <div class="skeleton" style="height: 9rem"></div>
      <div class="skeleton" style="height: 9rem"></div>
    </section>

  </main>

  <script>
    /* =================================================================
       SUPABASE CONNECTION
       Paste your project's details here (Supabase → Project Settings → API).
       The key is the "anon" / "publishable" key – it is meant to be public;
       the database's security rules decide what it can do.
       ================================================================= */
    const SUPABASE_URL = "https://vruayefwgzwlwestsedo.supabase.co";       // e.g. https://abcdefgh.supabase.co
    const SUPABASE_KEY = "sb_publishable_AWpInxkGOBc1bWFsJQjB_g_vBKftpm9";

    /*
      Data comes from the database view "ward_cards" (one row per ward).
      In notes and driver notes, "|" starts a new line.
      Driver notes starting with **WARNING** are shown as a highlighted warning.
    */

    const hospitalFilter = document.getElementById("hospitalFilter");
    const searchInput = document.getElementById("searchInput");
    const resultsElement = document.getElementById("results");
    const summaryElement = document.getElementById("summary");

    let db = null;
    let wardsData = [];
    let wardsById = new Map();

    /* ---------- Small helpers ---------- */

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalise(value) {
      return String(value == null ? "" : value).trim();
    }

    /* Make UK phone numbers tappable (e.g. "0300 443 4916"). Runs on escaped text. */
    function linkPhoneNumbers(escapedText) {
      return escapedText.replace(/\b0\d{2,4}(?:\s?\d{3,4}){2}\b/g, number =>
        `<a href="tel:${number.replace(/\s/g, "")}" data-track="call">${number}</a>`);
    }

    /* Notes: "|" becomes a new line; phone numbers become links */
    function formatNotes(value) {
      return normalise(value)
        .split("|")
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => linkPhoneNumbers(escapeHtml(line)))
        .join("<br>");
    }

    function mapUrl(c) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${c.latitude},${c.longitude}`)}`;
    }

    function navigationUrl(c) {
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${c.latitude},${c.longitude}`)}&travelmode=driving`;
    }

    /* ---------- Anonymous usage log ----------
       No personal data: a random ID kept on this device (for rate limiting only),
       what was searched, how many results, and which buttons were tapped. */

    const DEVICE_ID = (() => {
      const key = "dougs.device";
      try {
        let id = localStorage.getItem(key);
        if (!id) {
          id = crypto.randomUUID ? crypto.randomUUID()
            : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
                (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
          localStorage.setItem(key, id);
        }
        return id;
      } catch (e) {
        return null;
      }
    })();

    let lastSearch = "";
    let lastLoggedSearch = "";
    let searchTimer = null;

    function logUsage(event) {
      if (!db) return;
      db.from("usage_events")
        .insert({ device_id: DEVICE_ID, ...event })
        .then(() => {}, () => {});      // never let logging affect the app
    }

    function selectedHospitalId() {
      return hospitalFilter.value ? Number(hospitalFilter.value) : null;
    }

    /* Log a search once typing has paused for 2 seconds (not every letter) */
    function scheduleSearchLog(resultCount) {
      clearTimeout(searchTimer);
      const text = searchInput.value.trim().toLowerCase().slice(0, 60);
      lastSearch = text;
      if (text.length < 3) return;
      searchTimer = setTimeout(() => {
        if (text === lastLoggedSearch) return;
        lastLoggedSearch = text;
        logUsage({ kind: "search", search_text: text, result_count: resultCount, hospital_id: selectedHospitalId() });
      }, 2000);
    }

    /* Log taps on Map / Navigate / diagram / phone links */
    resultsElement.addEventListener("click", event => {
      const link = event.target.closest("[data-track]");
      if (!link) return;
      const card = link.closest("[data-ward]");
      const ward = card ? wardsById.get(Number(card.dataset.ward)) : null;
      logUsage({
        kind: link.dataset.track,
        ward_id: ward ? ward.id : null,
        hospital_id: ward ? ward.hospitalId : selectedHospitalId(),
        search_text: lastSearch.length >= 3 ? lastSearch : null
      });
    });

    /* ---------- Rendering ---------- */

    const WARNING = /^\*\*\s*WARNING\s*\*\*\s*/i;

    function driverNotesHtml(notes) {
      if (!notes) return "";
      if (WARNING.test(notes)) {
        return `<div class="alert alert--warn"><strong>Warning</strong>${formatNotes(notes.replace(WARNING, ""))}</div>`;
      }
      return `<div><dt>Driver notes:</dt> <dd>${formatNotes(notes)}</dd></div>`;
    }

    /* Small floor-plan icon shown on diagram buttons */
    const FLOORPLAN_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h7v9"/><path d="M14 3v6h7"/><path d="M14 13v8"/></svg>';

    /* Map pin: "this place on a map" */
    const PIN_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

    /* Navigation arrow: "take me there" */
    const NAV_ICON =
      '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">' +
      '<path d="M21 3 3 10.5l7.5 3L14 21 21 3z" fill="currentColor"/></svg>';

    /* "Ground Floor Diagram" -> "Ground Floor": the icon already says it's a diagram */
    function diagramLabel(name) {
      return normalise(name).replace(/\s*diagram$/i, "") || name;
    }

    function diagramButtons(diagrams) {
      if (!diagrams || diagrams.length === 0) {
        return `<span class="btn" aria-disabled="true">${FLOORPLAN_ICON}No diagram</span>`;
      }
      return diagrams.map(diagram => `
        <a class="btn btn--ghost" href="${escapeHtml(diagram.file)}" target="_blank" rel="noopener" data-track="diagram"
           aria-label="${escapeHtml(diagramLabel(diagram.name))} diagram">${FLOORPLAN_ICON}${escapeHtml(diagramLabel(diagram.name))}</a>
      `).join("");
    }

    function cardHtml(item) {
      const hasParking = item.coordinates !== null;
      const isWarning = hasParking && WARNING.test(item.driverNotes);

      const details = [
        item.floor ? `<div><dt>Floor:</dt> <dd>${escapeHtml(item.floor)}</dd></div>` : "",
        item.parkingLocation ? `<div><dt>Park at:</dt> <dd>${escapeHtml(item.parkingLocation)}</dd></div>` : "",
        item.preferredApproach ? `<div><dt>Approach:</dt> <dd>${escapeHtml(item.preferredApproach)}</dd></div>` : "",
        hasParking && !isWarning ? driverNotesHtml(item.driverNotes) : "",
        item.notes ? `<div><dt>Notes:</dt> <dd>${formatNotes(item.notes)}</dd></div>` : ""
      ].join("");

      const parkingActions = hasParking
        ? `<a class="btn btn--secondary" href="${escapeHtml(mapUrl(item.coordinates))}" target="_blank" rel="noopener" data-track="map">${PIN_ICON}Map</a>
           <a class="btn btn--go" href="${escapeHtml(navigationUrl(item.coordinates))}" target="_blank" rel="noopener" data-track="navigate">${NAV_ICON}Navigate</a>`
        : "";

      return `
        <article class="card ${hasParking ? (isWarning ? "card--warn" : "") : "card--plain"}" data-ward="${item.id}">
          <div class="card__eyebrow">${escapeHtml(item.hospital)}</div>
          <h2 class="card__title">${escapeHtml(item.ward)}</h2>
          <dl class="card__body">${details}</dl>
          ${isWarning ? `<div style="margin-bottom: var(--space-3)">${driverNotesHtml(item.driverNotes)}</div>` : ""}
          ${hasParking ? "" : '<p class="text-warn small"><strong>Parking location not yet available</strong></p>'}
          ${parkingActions ? `<div class="card__actions" style="margin-bottom: var(--space-2)">${parkingActions}</div>` : ""}
          <div class="card__actions">${diagramButtons(item.diagrams)}</div>
        </article>`;
    }

    function renderResults() {
      const selectedHospital = hospitalFilter.value;
      const search = searchInput.value.trim().toLowerCase();

      const matches = wardsData
        .filter(item => !selectedHospital || String(item.hospitalId) === selectedHospital)
        .filter(item => !search ||
          [item.ward, item.floor, item.notes].join(" ").toLowerCase().includes(search))
        .sort((a, b) => a.hospital.localeCompare(b.hospital) || a.ward.localeCompare(b.ward));

      summaryElement.textContent = `${matches.length} ${matches.length === 1 ? "result" : "results"}`;

      resultsElement.innerHTML = matches.length
        ? matches.map(cardHtml).join("")
        : '<div class="empty">No wards match your search.</div>';

      return matches.length;
    }

    function populateHospitals() {
      const hospitals = new Map();
      wardsData.forEach(item => hospitals.set(item.hospitalId, item.hospital));

      hospitalFilter.innerHTML = '<option value="">All hospitals</option>';
      [...hospitals.entries()]
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([id, name]) => {
          const option = document.createElement("option");
          option.value = String(id);
          option.textContent = name;
          hospitalFilter.appendChild(option);
        });
    }

    /* ---------- Start ---------- */

    function showError(message) {
      summaryElement.textContent = "Data failed to load";
      summaryElement.classList.add("status-line--error");
      resultsElement.innerHTML = `
        <div class="alert alert--danger">
          <strong>The ward and parking data could not be loaded.</strong>
          ${escapeHtml(message)}
        </div>`;
    }

    async function startApp() {
      if (SUPABASE_URL.startsWith("PASTE") || SUPABASE_KEY.startsWith("PASTE")) {
        showError("The Supabase project details haven't been added to index.html yet.");
        return;
      }
      if (!window.supabase) {
        showError("Couldn't load the database library. Check the internet connection and refresh.");
        return;
      }

      try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: false }
        });

        const { data, error } = await db.from("ward_cards").select("*");
        if (error) throw error;

        wardsData = data.map(row => ({
          id: row.id,
          hospitalId: row.hospital_id,
          hospital: normalise(row.hospital),
          ward: normalise(row.ward),
          floor: normalise(row.floor),
          notes: normalise(row.notes),
          parkingLocation: normalise(row.parking_location),
          preferredApproach: normalise(row.preferred_approach),
          driverNotes: normalise(row.driver_notes),
          coordinates: row.latitude != null && row.longitude != null
            ? { latitude: Number(row.latitude), longitude: Number(row.longitude) }
            : null,
          diagrams: Array.isArray(row.diagrams) ? row.diagrams : []
        }));
        wardsById = new Map(wardsData.map(item => [item.id, item]));

        populateHospitals();

        hospitalFilter.addEventListener("change", () => scheduleSearchLog(renderResults()));
        searchInput.addEventListener("input", () => scheduleSearchLog(renderResults()));

        renderResults();
      } catch (error) {
        console.error(error);
        showError("The database may be waking up or unreachable. Wait a moment and refresh. " +
                  (error && error.message ? `(${error.message})` : ""));
      }
    }

    startApp();
  </script>
</body>
</html>
